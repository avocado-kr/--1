        const A = Math.min(2.6, MAP_HW - size / 2 - 0.4 - Math.abs(l));
        movers.push({ kind: 'move', c, bz: l, A, w: (1.1 + rng() * 0.9) * sf, ph: rng() * 6.28 });
      } else if (type === 'dis') {
        c.mesh.material.transparent = true; c.mesh.material.color.set(0xb8f0ff);
        movers.push({ kind: 'dis', c, T: 3.0 / sf, ph: rng() * 3 });
      } else if (type === 'spin') {
        const gr = new THREE.Group(), len = size * 0.98;
        const bar = mesh(new THREE.BoxGeometry(len, 0.35, 0.35), mat(0xff2a2a, { emissive: 0x550000 }));
        const post = mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.8, 8), mat(0x444444)); post.position.y = -0.3;
        gr.add(bar, post); gr.position.set(x, y + 0.6, l); world.add(gr);
        const sp = { kind: 'spin', g: gr, cx: x, cz: l, y0: y + 0.6, len, angle: rng() * 6, w: (2.0 + rng() * 1.0) * sf * (rng() < 0.5 ? 1 : -1) };
        movers.push(sp); hazards.push(sp);
      } else if (type === 'spike') {
        const sk = mesh(new THREE.BoxGeometry(1.2, 1.1, 1.2), mat(0xff2a2a, { emissive: 0x660000 }));
        sk.position.set(x, y + 0.55, l); world.add(sk);
        hazards.push({ kind: 'spike', minX: x - 0.55, maxX: x + 0.55, minZ: l - 0.55, maxZ: l + 0.55, minY: y, maxY: y + 1.05 });
      }
      prevEnd = x + size / 2; prevW = size;
    }

    // 달걀 훔치는 둥지 (2배 크기): 달걀 5개 + 잠자는 보스
    const NL = 24;
    const nx = prevEnd + cfg.gap * 0.8 + NL / 2;
    y = Math.max(0, Math.min(10, y + 0.3)); l = 0;
    addPlatform(nx, 0, y, NL, MAP_HW * 2, L.nest);
    // 보스는 둥지의 왼쪽(-z)에서 오른쪽(+z)을 보고 자고, 달걀 5개는 보스 앞에 곡선(호) 모양으로 놓임
    const bossZ = -MAP_HW + 1.5 + Math.min(2, L.bossH * 0.25);
    const R = 3 + L.bossH * 0.5;
    const spots = [];
    for (let i = 0; i < 5; i++) {
      const a = (-50 + i * 25) * Math.PI / 180;
      const p = new THREE.Vector3(nx + Math.sin(a) * R, y, bossZ + Math.cos(a) * R);
      const ring = mesh(new THREE.TorusGeometry(0.45, 0.16, 8, 18), mat(0xc49a4a)); ring.rotation.x = Math.PI / 2;
      ring.position.set(p.x, y + 0.1, p.z); world.add(ring);
      spots.push(p);
    }
    const boss = makeAnimal(L.bossType, L.bossH);
    const sleepPos = new THREE.Vector3(nx, y - L.sink, bossZ), sleepRot = 0;
    boss.g.position.copy(sleepPos); boss.g.rotation.y = sleepRot;
    world.add(boss.g);
    const zzz = textSprite([{ text: 'Zzz', font: 'bold 90px Arial', color: '#bfe0ff', y: 64 }], 256, 128, Math.max(1.4, L.bossH * 0.5), false);
    world.add(zzz);
    const n = { lv: li, x: nx, top: y, eggs: [], spots, group: new THREE.Group(), boss, zzz, sleepPos, sleepRot };
    world.add(n.group);
    nests.push(n);
    prevEnd = nx + NL / 2; prevW = MAP_HW * 2;
  });
  mapEnd = prevEnd;

  // 직사각형 경계 (투명 벽)
  // 오비 구간(x ≥ 0)은 좁게(±MAP_HW), 농장(x < 0)은 우리 5개가 들어가게 넓게(±FARM_HW)
  const len = mapEnd, midX = mapEnd / 2;
  const wallMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.06, side: THREE.DoubleSide, depthWrite: false });
  [-1, 1].forEach(sd => {
    const w = new THREE.Mesh(new THREE.PlaneGeometry(len, 50), wallMat); w.position.set(midX, 12, sd * MAP_HW); world.add(w);
    addCollider(midX, sd * (MAP_HW + 0.5), len / 2, 0.5, -100, 100);
    for (let x = 0; x <= mapEnd; x += 12) {
      const p = mesh(new THREE.CylinderGeometry(0.15, 0.15, 50, 6), mat(0xffffff, { emissive: 0xffffff, emissiveIntensity: 0.2 }), false);
      p.position.set(x, 12, sd * MAP_HW); world.add(p);
    }
    const fw = new THREE.Mesh(new THREE.PlaneGeometry(-FARM_X0, 50), wallMat); fw.position.set(FARM_X0 / 2, 12, sd * FARM_HW); world.add(fw);
    addCollider(FARM_X0 / 2, sd * (FARM_HW + 0.5), -FARM_X0 / 2, 0.5, -100, 100);
    // 농장 앞쪽 가장자리 (오비 입구 양옆 막기)
    const sw = (FARM_HW - MAP_HW) / 2, sz = sd * (MAP_HW + sw);
    const ew = new THREE.Mesh(new THREE.PlaneGeometry(sw * 2, 50), wallMat); ew.rotation.y = Math.PI / 2; ew.position.set(0, 12, sz); world.add(ew);
    addCollider(0.5, sz, 0.5, sw, -100, 100);
  });
  addCollider(FARM_X0 - 0.5, 0, 0.5, FARM_HW, -100, 100);
  addCollider(mapEnd + 0.5, 0, 0.5, MAP_HW, -100, 100);
  [[FARM_X0, FARM_HW], [mapEnd, MAP_HW]].forEach(([x, hw]) => { const w = new THREE.Mesh(new THREE.PlaneGeometry(hw * 2, 50), wallMat); w.rotation.y = Math.PI / 2; w.position.set(x, 12, 0); world.add(w); });

  // 밤에 생기는 방벽 (농장 → 오비 입장 막기)
  barrier = new THREE.Mesh(new THREE.BoxGeometry(0.4, 14, MAP_HW * 2),
    new THREE.MeshStandardMaterial({ color: 0x8a5cff, emissive: 0x6a3cff, emissiveIntensity: 1, transparent: true, opacity: 0.55 }));
  barrier.position.set(0.2, 6, 0); barrier.visible = false; world.add(barrier);
  barrierC = addCollider(0.2, 0, 0.2, MAP_HW, -5, 14, { solid: false });

  profile.sort((a, b) => a.x0 - b.x0);
  buildScenery(rng);
}

function rollNest(n) {
  n.group.clear(); n.eggs = [];
  let secret = false;
  // 같은 날(낮밤 주기)에는 다시 켜도 똑같은 달걀이 나오게 시드 고정
  const rand = rngFn(lastCycle * 7919 + n.lv * 101 + 13); rand();
  n.spots.forEach((sp, idx) => {
    const g = rollGrade(n.lv, rand);
    const pos = new THREE.Vector3(sp.x, sp.y + EGG_SCALE * 1.05, sp.z);
    const m = makeEggMesh(n.lv, g); m.position.copy(pos); n.group.add(m);
    const outline = new THREE.Mesh(EGG_GEO, OUTLINE_MAT); outline.scale.setScalar(1.14); outline.visible = false; m.add(outline);
    const parts = [m];
    let aura = null;
    if (g === SECRET) {
      secret = true;
      aura = halo(0xff4dd2, 2.4); aura.position.copy(pos); n.group.add(aura); parts.push(aura);
      const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 80, 8, 1, true),
        new THREE.MeshBasicMaterial({ color: 0xff4dd2, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false }));
      beam.position.set(pos.x, pos.y + 40, pos.z); n.group.add(beam); parts.push(beam);
    }
    n.eggs.push({ idx, g, pos, mesh: m, outline, aura, parts, taken: false, ph: Math.random() * 6 });
  });
  return secret;
}
function respawnAllEggs() {

function updateMovers(dt, T) {
  for (const m of movers) {
    if (m.kind === 'move') {
      const nz = m.bz + Math.sin(T * m.w + m.ph) * m.A, c = m.c;
      c.dx = 0; c.dz = nz - c.cz; c.cz = nz; setBounds(c); c.mesh.position.z = nz;
    } else if (m.kind === 'dis') {
      const ph = ((T + m.ph) % m.T) / m.T, c = m.c;
      c.solid = ph < 0.78;
      c.mesh.material.opacity = ph < 0.5 ? 0.9 : ph < 0.78 ? (Math.sin(T * 35) > 0 ? 0.85 : 0.25) : 0.07;
    } else if (m.kind === 'spin') {
      m.angle += m.w * dt; m.g.rotation.y = m.angle;
    }
  }
}
// 보스가 오비 위를 따라 달릴 때의 높이 (빈틈에서는 점프)
function groundAt(x) {
  let prev = null;
  for (const p of profile) {
    if (x >= p.x0 && x <= p.x1) return p.top;
    if (p.x1 < x) { if (!prev || p.x1 > prev.x1) prev = p; }
    else if (p.x0 > x) {
      if (!prev) return p.top;
      const t = (x - prev.x1) / (p.x0 - prev.x1);
      return prev.top + (p.top - prev.top) * t + Math.sin(t * Math.PI) * 2;
    }
  }
  return prev ? prev.top : 0;
}

function rebuildPen(k) {
  const grp = penGroups[k], slots = penSlots(k), own = k === myPen, vis = [];
  grp.clear();
  if (own) slotMarks = [];
  for (let i = 0; i < SLOTS; i++) {
    const p = slotPos(i, k);
    const s = slots[i];
    if (!s) {
      vis.push(null);
      if (own) { const m = slotMark(i); m.position.copy(p); grp.add(m); slotMarks[i] = m; }
      continue;
    }
    if (!isHatched(s)) {
      const inc = mesh(new THREE.CylinderGeometry(0.45, 0.5, 0.35, 16), mat(0xb0b0b0, { metalness: 0.6, roughness: 0.3 })); inc.position.set(p.x, 0.3, p.z); grp.add(inc);
      const dome = new THREE.Mesh(new THREE.SphereGeometry(0.48, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xcfefff, transparent: true, opacity: 0.3, roughness: 0.1 }));
      dome.position.set(p.x, 0.47, p.z); grp.add(dome);
      const egg = makeEggMesh(s.lv, s.g); egg.position.set(p.x, 0.47 + EGG_SCALE, p.z); grp.add(egg);
      if (s.g === SECRET) { const h = halo(0xff4dd2, 2); h.position.copy(egg.position); grp.add(h); }
      const label = liveLabel(); label.position.set(p.x, 1.7, p.z); grp.add(label);
      label.draw(`⏳ 부화까지 ${minSec(growLeft(s) / (night ? NIGHT_MULT : 1))}`);

      v.baby.wings.forEach((w, k) => { w.rotation.z = (k ? -1 : 1) * Math.sin(T * 6) * 0.5; });
      const fly = v.baby.flying ? 0.6 + Math.sin(T * 2) * 0.2 : (moving ? Math.abs(Math.sin(v.anim)) * 0.05 : 0);

let B = null; // 깨어난 보스
function wakeBoss(n) {

}
function sleepBoss() {
  if (!B) return;
  const n = B.n, m = n.boss;
  m.g.position.copy(n.sleepPos); m.g.rotation.y = n.sleepRot;
  m.legs.forEach(l => l.rotation.x = 0);

}
function updateBoss(dt) {
  if (!B) return;
  const L = B.L, m = B.model;
  // 방벽 자리(농장 입구)에 도착하면 쫓아오던 보스는 원래 자리로 돌아감

    toast(`${L.emoji} ${L.boss}가 포기하고 둥지로 돌아갔어요!\n우리에 달걀을 넣어요`, 2.2);
    return;
  }
  if (B.state === 'waking') {
    B.t += dt;
    const k = Math.min(1, B.t / 1.8);
    m.g.position.y = B.y - L.sink * (1 - k) + (k < 1 ? Math.abs(Math.sin(B.t * 20)) * 0.1 : 0);
    const want = Math.atan2(P.pos.x - B.x, P.pos.z - B.z);
    B.face += Math.atan2(Math.sin(want - B.face), Math.cos(want - B.face)) * Math.min(1, dt * 4);
    m.g.rotation.y = B.face;
    if (B.t >= 1.8) { B.state = 'chase'; toast(`${L.emoji} ${L.boss}가 쫓아온다!\n농장까지 도망쳐!`, 2.5); }
  } else {
    let speed = L.speed;
    B.pounceCD -= dt;
    const dist = Math.hypot(P.pos.x - B.x, P.pos.z - B.z);
    if (B.n.lv === 1 && B.pounceCD <= 0 && dist < 9) { B.pounceT = 0.55; B.pounceCD = 3; toast('🐯 덮친다!', 0.8); }
    if (B.pounceT > 0) { B.pounceT -= dt; speed *= 2.2; }

    B.x += Math.sign(dx) * Math.min(Math.abs(dx), speed * dt);
    B.x = Math.max(1, B.x); // 보스는 농장 안으로는 못 들어옴
    const tz = Math.max(-MAP_HW + 1, Math.min(MAP_HW - 1, P.pos.z));
    B.z += (tz - B.z) * Math.min(1, dt * 2.5);
    B.y = groundAt(B.x);

    const want = Math.atan2(P.pos.x - B.x, P.pos.z - B.z);
    B.face += Math.atan2(Math.sin(want - B.face), Math.cos(want - B.face)) * Math.min(1, dt * 6);
    let hop = 0;
    if (B.n.lv === 1 && B.pounceT > 0) hop = Math.sin((1 - B.pounceT / 0.55) * Math.PI) * 1.5;
    if (B.n.lv === 0) hop = Math.abs(Math.sin(T * 12)) * 0.15;
    m.g.position.set(B.x, B.y + hop, B.z); m.g.rotation.y = B.face;
    if (B.n.lv === 2) shake = Math.max(shake, Math.max(0, 1 - dist / 30) * 0.35 * Math.abs(Math.sin(B.anim)));

    const dy = P.pos.y - B.y;
    if (P.invuln <= 0 && dist < L.catchR + HW && dy > -1.5 && dy < L.bossH) return caught();
  }
  B.anim += dt * (B.speedNow * (B.n.lv === 2 ? 1.0 : 2.2) + 0.5);

  m.legs.forEach((lp, i) => { const ph = m.legs.length === 4 ? [0, Math.PI, Math.PI, 0][i] : i * Math.PI; lp.rotation.x = Math.sin(B.anim + ph) * amp; });
  B.icon.position.set(m.g.position.x, m.g.position.y + L.bossH + 0.6 + Math.sin(T * 6) * 0.15, m.g.position.z);
}

  skyCol.set(LEVELS[zone].sky).lerp(nightCol, nightK);
  scene.background.lerp(skyCol, Math.min(1, dt * 2)); scene.fog.color.copy(scene.background);
  hemi.intensity = 0.8 - nightK * 0.45; sun.intensity = 0.9 - nightK * 0.7;
  stars.material.opacity = nightK; stars.position.copy(camera.position);
}

// =====================================================================
//  플레이어 물리
// =====================================================================
function overlapP(c) {
  return P.pos.x + HW > c.minX && P.pos.x - HW < c.maxX && P.pos.z + HW > c.minZ && P.pos.z - HW < c.maxZ &&
         P.pos.y < c.maxY && P.pos.y + PH > c.minY;
}
function resolveH(axis) {
  for (const c of colliders) {
    if (!c.solid || !overlapP(c)) continue;
    if (c.maxY - P.pos.y <= 0.3) { P.pos.y = c.maxY; continue; } // 작은 턱은 올라감
    if (axis === 'x') P.pos.x = P.pos.x < c.cx ? c.minX - HW - 0.001 : c.maxX + HW + 0.001;
    else P.pos.z = P.pos.z < c.cz ? c.minZ - HW - 0.001 : c.maxZ + HW + 0.001;
  }
}
function nearEgg() {
  if (P.held) return null;
  let best = null, bd = 1.6;
  const consider = (n, e) => {
    if (e.taken) return;
    const d = Math.hypot(P.pos.x - e.pos.x, P.pos.z - e.pos.z);
    if (d < bd && Math.abs(P.pos.y - (e.pos.y - EGG_SCALE)) < 1) { bd = d; best = { n, e }; }
  };
  for (const n of nests) for (const e of n.eggs) consider(n, e);
  for (const ge of groundEggs) consider(ge.n, ge);
  return best;
}
const inPen = () => P.pos.x > PEN.x0 && P.pos.x < PEN.x1 && Math.abs(P.pos.z - penZ(myPen)) < PEN.z && P.pos.y < 1.5;
const inOtherPen = () => P.pos.x > PEN.x0 && P.pos.x < PEN.x1 && P.pos.y < 1.5 && Math.abs(P.pos.z) < FARM_HW && !inPen() &&
  Math.abs(P.pos.z - penZ(Math.round(P.pos.z / PEN_STEP) + 2)) < PEN.z;
// 내 우리 안에서 가장 가까운 빈 칸 (여기에 달걀을 심음)
function nearEmptySlot() {
  if (!inPen()) return null;
  let best = null, bd = 1.3;
  for (let i = 0; i < SLOTS; i++) {
    if (SAVE.slots[i]) continue;
    const p = slotPos(i), d = Math.hypot(P.pos.x - p.x, P.pos.z - p.z);
    if (d < bd) { bd = d; best = { i, d }; }
  }
  return best;
}
const penFull = () => { for (let i = 0; i < SLOTS; i++) if (!SAVE.slots[i]) return false; return true; };
let markOn = -1;
function highlightSlot(i) {
  if (markOn === i) return;
  if (slotMarks[markOn]) slotMarks[markOn].ring.material = MARK_MAT;
  markOn = i;
  if (slotMarks[i]) slotMarks[i].ring.material = MARK_ON;
}
// 달걀을 안 들었을 때 E키: 빈 칸(핫바 아이템 놓기) / 펫·알 들기 중 더 가까운 쪽
function penChoice() {
  if (P.held) return null;
  const es = nearEmptySlot(), pi = nearPenItem(), hot = SAVE.inv[hotSel];
  const pp = pi && (pi.v.kind === 'baby' ? pi.v.pos : pi.v.egg.position);
  const pd = pi ? Math.hypot(P.pos.x - pp.x, P.pos.z - pp.z) : 99;
  if (es && hot && es.d < pd) return { place: es.i };
  if (pi) return { pick: pi };
  return null;
}
function penAction() {
  if (P.held) {
    if (!inPen()) return;
    const es = nearEmptySlot();
    if (es) depositEgg(es.i);
    else if (penFull()) depositEgg(-1);
    return;
  }
  const c = penChoice();
  if (c && c.place !== undefined) placeInvAt(hotSel, c.place);
  else if (c) pickPenItem(c.pick);
}
const nearSellShop = () => Math.hypot(P.pos.x - sellPos.x, P.pos.z - (sellPos.z - 1.3)) < 2.2 && P.pos.y < 1;
// 우리 안에서 가까운 펫/부화 중인 알
function nearPenItem() {
  if (!inPen() || P.held) return null;
  let best = null, bd = 1.5;
  farmVis.forEach((v, i) => {
    if (!v) return;
    const p = v.kind === 'baby' ? v.pos : v.egg.position;
    const d = Math.hypot(P.pos.x - p.x, P.pos.z - p.z);
    if (d < bd) { bd = d; best = { i, v }; }
  });
  return best;
}
const nearShop = () => Math.hypot(P.pos.x - shopPos.x, P.pos.z - (shopPos.z + 1.3)) < 2.2 && P.pos.y < 1;
const zoneAt = x => x < 0 ? -1 : x >= levelStarts[2] ? 2 : x >= levelStarts[1] ? 1 : 0;
let outlined = null;

// 바닥에 내려놓은 달걀 (다른 단계에서 내려놓으면 그 자리에 남음, 밤이 되면 사라짐)
const groundGroup = new THREE.Group(); world.add(groundGroup);
let groundEggs = [];
let groundSeq = 0;
function spawnGroundEgg(h, x, y, z, id) {
  if (!id) { id = `${NET.id}-${++groundSeq}`; NET.send({ t: 'gdrop', c: lastCycle, gid: id, lv: h.lv, g: h.g, i: h.e.idx, x, y, z }); }
  const pos = new THREE.Vector3(x, y + EGG_SCALE * 1.05, z);
  const m = makeEggMesh(h.lv, h.g); m.position.copy(pos); groundGroup.add(m);
  const outline = new THREE.Mesh(EGG_GEO, OUTLINE_MAT); outline.scale.setScalar(1.14); outline.visible = false; m.add(outline);
  const parts = [m];
  if (h.g === SECRET) { const a = halo(0xff4dd2, 2.2); a.position.copy(pos); groundGroup.add(a); parts.push(a); }
  groundEggs.push({ id, ground: true, g: h.g, n: h.n, origin: h.e, pos, mesh: m, outline, parts, taken: false, ph: Math.random() * 6 });
}
function clearGroundEggs() { groundGroup.clear(); groundEggs = []; }
function removeGroundEgg(e) { e.parts.forEach(p => groundGroup.remove(p)); groundEggs = groundEggs.filter(x => x !== e); }
function hideEgg(e) { e.taken = true; e.parts.forEach(p => p.visible = false); e.outline.visible = false; if (outlined === e) outlined = null; }
function returnToNest(e, remote) {
  e.taken = false; e.parts.forEach(p => p.visible = true);
  if (!remote) NET.send({ t: 'ret', c: lastCycle, lv: nests.findIndex(n => n.eggs.includes(e)), i: e.idx });
}
// 들고 있던 달걀을 놓음: 그 달걀의 단계 안이면 원래 둥지로, 다른 단계면 그 자리에 남음
function releaseEgg(x, y, z) {
  const h = P.held; if (!h) return null;
  P.held = null; playerModel.holder.clear(); sleepBoss();
  if (zoneAt(x) === h.lv) { returnToNest(h.e); return 'nest'; }
  spawnGroundEgg(h, x, y, z); return 'ground';
}
function dropEgg() {
  if (state !== 'play' || !P.held) return;
  if (!P.onGround || P.flying > 0) { toast('땅 위에서만 내려놓을 수 있어요', 1.2); return; }
  const r = releaseEgg(P.pos.x, P.pos.y, P.pos.z);
  toast(r === 'nest' ? '🥚 달걀이 원래 자리로 돌아갔어요' : '🥚 달걀을 이 자리에 내려놓았어요', 1.8);
}

function updatePlayer(dt) {
  const fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) + joy.y;
  const side = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x;
  let wx = -Math.sin(camYaw) * fwd + Math.cos(camYaw) * side, wz = -Math.cos(camYaw) * fwd - Math.sin(camYaw) * side;
  const wl = Math.hypot(wx, wz); if (wl > 1) { wx /= wl; wz /= wl; }   // 조이스틱은 살짝 밀면 천천히
  const acc = Math.min(1, dt * (P.onGround ? 14 : 5));
  P.vel.x += (wx * RUN - P.vel.x) * acc; P.vel.z += (wz * RUN - P.vel.z) * acc;

  if (P.ground) { P.pos.x += P.ground.dx; P.pos.z += P.ground.dz; }

  P.coyote = P.onGround ? 0.12 : P.coyote - dt;
  P.jumpBuf -= dt;
  if (flyQueue > 0) { flyQueue -= dt; if (flyQueue <= 0 && !P.onGround && !(P.flying > 0) && !P.held && !P.pick) startFly(); }
  if (P.jumpBuf > 0 && P.coyote > 0) { P.vel.y = JUMP; P.coyote = 0; P.jumpBuf = 0; P.onGround = false; P.ground = null; sfx('jump'); }

  // 밤에는 농장 쪽에서 오비로 못 들어감 (방벽)
  barrierC.solid = night && P.pos.x < barrierC.cx;

  if (P.flying > 0) { P.flying -= dt; if (P.flying <= 0) stopFly(); }

  const steps = Math.ceil(dt / (1 / 120)), h = dt / steps;
  for (let i = 0; i < steps; i++) {
    if (P.flying > 0) P.vel.y = 0;             // 비행 중에는 높이 유지
    else P.vel.y = Math.max(P.vel.y - G * h, -45);
    P.pos.x += P.vel.x * h; resolveH('x');
    P.pos.z += P.vel.z * h; resolveH('z');
    const prevY = P.pos.y; P.pos.y += P.vel.y * h;
    P.onGround = false;
    let ground = null;
    for (const c of colliders) {
      if (!c.solid || !overlapP(c)) continue;
      if (P.vel.y <= 0 && prevY >= c.maxY - 0.3) { P.pos.y = c.maxY; P.vel.y = 0; P.onGround = true; ground = c; }
      else if (P.vel.y > 0 && prevY + PH <= c.minY + 0.3) { P.pos.y = c.minY - PH; P.vel.y = 0; }
    }
    P.ground = ground;
  }
  if (P.onGround) P.canFly = true;   // 땅에 닿으면 다시 날 수 있음

  // 위험물: 회전 막대 HP -30, 가시 블록 HP -70 (HP 0이 되면 농장으로) / 낙하 → 농장으로
  P.hurtT -= dt;
  if (P.pos.x < 0) P.hp = MAX_HP;   // 농장에 오면 HP 회복
  if (P.hurtT <= 0) for (const hz of hazards) {
    if (hz.kind === 'spike') {
      if (P.pos.x + HW > hz.minX && P.pos.x - HW < hz.maxX && P.pos.z + HW > hz.minZ && P.pos.z - HW < hz.maxZ && P.pos.y < hz.maxY && P.pos.y + PH > hz.minY) {
        if (hurt(70, '앗! 가시 블록!', P.pos.x - (hz.minX + hz.maxX) / 2, P.pos.z - (hz.minZ + hz.maxZ) / 2)) return;
        break;
      }
    } else {
      const dx = P.pos.x - hz.cx, dz = P.pos.z - hz.cz, ca = Math.cos(hz.angle), sa = Math.sin(hz.angle);
      const lx = dx * ca - dz * sa, lz = dx * sa + dz * ca;
      if (Math.abs(lx) < hz.len / 2 + HW && Math.abs(lz) < 0.18 + HW && P.pos.y < hz.y0 + 0.18 && P.pos.y + PH > hz.y0 - 0.18) {
        if (hurt(30, '으악! 회전 막대!', dx, dz)) return;
        break;
      }
    }
  }
  if (P.pos.y < -12) return fail(P.pos.x > levelStarts[2] ? '앗 뜨거! 용암에 빠졌다!' : '으아아 떨어졌다!');

  // 달걀 가까이 가면 흰색 윤곽선
  const ne = nearEgg();
  const holdPick = keys.KeyE || mouseHeld || touchHeld;
  if (!P.pick && holdPick && ne && !(P.flying > 0)) P.pick = { n: ne.n, e: ne.e, t: 0, tick: 0 };   // 날개로 나는 중에는 못 듦
  const target = P.pick ? P.pick.e : ne ? ne.e : null;
  if (outlined !== target) { if (outlined) outlined.outline.visible = false; if (target) target.outline.visible = true; outlined = target; }

  // 달걀 들기 (3초 동안 꾹 누르기)
  let pr = '';
  if (P.pick) {
    const pk = P.pick, d = Math.hypot(P.pos.x - pk.e.pos.x, P.pos.z - pk.e.pos.z);
    if (pk.e.taken || d > 2.2) { P.pick = null; toast('달걀 들기 취소', 1); }
    else if (!holdPick) { P.pick = null; toast('✋ 손을 떼서 취소됐어요\n3초 동안 꾹 누르고 있어야 해요', 1.6); }
    else {
      pk.t += dt; pk.tick -= dt;
      if (pk.tick <= 0) { sfx('tick'); pk.tick = 0.5; }
      pr = `${eggLabel(pk.n.lv, pk.e.g)} 훔치는 중... ${Math.max(0, 3 - pk.t).toFixed(1)}초<div class="pbar"><div style="width:${Math.min(100, pk.t / 3 * 100)}%"></div></div>`;
      if (pk.t >= 3) { takeEgg(pk.n, pk.e); P.pick = null; pr = ''; }
    }
  } else if (nearShop()) {
    pr = '<b>E</b> — 🪽 날개 상점 열기';
  } else if (nearSellShop()) {
    pr = '<b>E</b> — 💰 판매 상점 열기 (펫·알 팔기)';
  } else if (P.held && inPen()) {
    const es = nearEmptySlot();
    if (es) pr = `<b>E</b> — 🥚 <b>${es.i + 1}번 칸</b>에 달걀 심기`;
    else if (penFull()) pr = `우리가 가득 찼어요 — <b>E</b>: 달걀 팔기 (+${fmt(animalOf(P.held.lv, P.held.g).inc * 60)}원)`;
    else pr = '🐣 원하는 <b>빈 칸</b>(바닥의 노란 동그라미) 위로 가서 <b>E</b>를 눌러 심어요';
  } else if (penChoice()) {
    const c = penChoice();
    if (c.place !== undefined) pr = `<b>E</b> — 핫바 ${hotSel + 1}번 ${itemName(SAVE.inv[hotSel])}을(를) <b>${c.place + 1}번 칸</b>에 놓기`;
    else { const { v } = c.pick; pr = `<b>E</b> — ${v.kind === 'baby' ? `${EMOJI[v.a.type]} ${v.a.name}` : '🥚 부화 중인 알'} 들기 (🎒 인벤토리로)`; }
  } else if (P.held && inOtherPen()) {
    pr = '🚫 다른 사람의 우리예요 — <b>내 우리</b>(노란 간판)로 가세요';
  } else if (ne && P.flying > 0) {
    pr = '🪽 날개로 나는 중에는 달걀을 들 수 없어요';
  } else if (ne) {
    pr = `<b>E</b> 또는 <b>클릭</b>을 <b>3초 꾹</b> — ${eggLabel(ne.n.lv, ne.e.g)} 들기 <span style="color:#ff8080">⚠ ${LEVELS[ne.n.lv].boss}가 깨어나요!</span>`;
  } else if (P.held && P.pos.x < 0 && !inPen()) {
    pr = '🐣 울타리 우리 안으로 들어가야 달걀을 넣을 수 있어요';
  }
  $('prompt').classList.toggle('hidden', !pr);
  if (pr) $('prompt').innerHTML = pr;

  // 우리 안: 심을 칸 노랗게 표시 (달걀을 들었거나 핫바에 아이템이 있을 때)
  const hc = P.held ? nearEmptySlot() : penChoice();
  highlightSlot(P.held ? (hc ? hc.i : -1) : (hc && hc.place !== undefined ? hc.place : -1));
  P.invuln -= dt;

  // 모델 애니메이션
  const hs = Math.hypot(P.vel.x, P.vel.z);
  if (hs > 0.5) {
    const want = Math.atan2(P.vel.x, P.vel.z); let diff = want - P.face; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    P.face += diff * Math.min(1, dt * 12);
  }
  P.anim += dt * hs * 1.6;
  const pm = playerModel, sw = P.onGround ? Math.sin(P.anim) * Math.min(1, hs / 6) * 0.9 : 0.5;
  pm.legs[0].rotation.x = sw; pm.legs[1].rotation.x = -sw;
  const up = P.held || P.pick;
  pm.arms[0].rotation.x = up ? Math.PI : -sw; pm.arms[1].rotation.x = up ? Math.PI : sw;
  pm.g.position.copy(P.pos); pm.g.rotation.y = P.face;
  pm.g.visible = !((P.invuln > 0 || P.hurtT > 0) && Math.sin(T * 30) > 0);
  if (P.flying > 0) pm.wl.forEach((p, k) => { p.rotation.z = (k ? -1 : 1) * Math.sin(T * 14) * 0.5; });
}

// 실패 (떨어짐 / 함정 / 잡힘) → 달걀 없이 농장으로
function goFarm() {
  if (P.held) { P.held = null; playerModel.holder.clear(); }
  P.pick = null; sleepBoss(); stopFly(); P.hp = MAX_HP; P.hurtT = 0;
  P.pos.copy(farmSpawn()); P.vel.set(0, 0, 0); P.ground = null; P.invuln = 1;
  camYaw = -Math.PI / 2;
}
// 함정에 맞음: HP만 줄고 그대로 통과 (1초 무적). HP 0이면 농장으로 → true 반환
function hurt(dmg, msg) {
  P.hp = Math.max(0, P.hp - dmg);
  if (P.hp <= 0) { fail(`${msg} HP 0!`); return true; }
  P.hurtT = 1.0; shake = 0.25; sfx('die');
  toast(`${msg} -${dmg} HP`, 1.2);
  return false;
}
function fail(msg) {
  const had = P.held;
  if (had) { P.held = null; playerModel.holder.clear(); sleepBoss(); returnToNest(had.e); }   // 떨어진 달걀은 원래 둥지로
  sfx('die'); shake = 0.4; goFarm();
  toast(had ? `${msg}\n달걀은 원래 자리로 돌아갔어요` : `${msg}\n농장으로 돌아왔어요`, 2.2);
}
function caught() {
  const L = B.L;
  const y = P.onGround ? P.pos.y : groundAt(P.pos.x);
  const r = releaseEgg(P.pos.x, y, P.pos.z);
  sfx('caught'); shake = 0.6; goFarm();
  toast(`${L.emoji} ${L.boss}에게 잡혔다!\n${r === 'nest' ? '달걀은 원래 자리로 돌아갔어요' : '달걀은 잡힌 자리에 떨어졌어요'}`, 2.8);
}

function takeEgg(n, e) {
  hideEgg(e);
  let origin = e;
  if (e.ground) {   // 바닥에 내려놨던 달걀을 다시 주움
    origin = e.origin;
    removeGroundEgg(e);
    NET.send({ t: 'gtake', c: lastCycle, gid: e.id });
  } else NET.send({ t: 'take', c: lastCycle, lv: n.lv, i: e.idx });
  P.held = { lv: n.lv, g: e.g, n, e: origin };
  stopFly();   // 달걀을 들면 날 수 없음
  const held = makeEggMesh(n.lv, e.g); playerModel.holder.add(held);
  if (e.g === SECRET) { const h = halo(0xff4dd2, 1.6); playerModel.holder.add(h); }
  sfx('pick');
  toast(`🥚 ${eggLabel(n.lv, e.g)}을(를) 들었다!\n😱 ${LEVELS[n.lv].boss}가 깨어난다...!`, 2.2);
  camYaw = Math.PI / 2;   // 농장 쪽을 바라보게
  wakeBoss(n);
}

// 고른 칸(idx)에 들고 온 달걀 심기. idx = -1 이면 우리가 가득 차서 팔기
function depositEgg(idx) {
  const { lv, g } = P.held, a = animalOf(lv, g);
  if (idx >= 0 && !SAVE.slots[idx]) {
    SAVE.slots[idx] = newSlot(lv, g, 0);
    toast(`🏡 ${eggLabel(lv, g)}을(를) ${idx + 1}번 칸에 심었다!\n무엇이 태어날까?`, 2.4);
  } else {
    const price = a.inc * 60;
    SAVE.money += price;
    toast(`농장이 가득 차서 달걀을 팔았다! +${fmt(price)} 💰`, 2.8);
  }
  if (!SAVE.codex.includes(lv + '-' + g)) SAVE.codex.push(lv + '-' + g);
  sfx('clear');
  P.held = null; playerModel.holder.clear();
  sleepBoss();
  save(); rebuildFarm();
}

// =====================================================================
//  게임 상태 / 화면
// =====================================================================
let state = 'title', T = 0, night = isNightAt(Date.now()), lastCycle = cycleIndex(Date.now());
const overlay = $('overlay');
function showOverlay(html) { overlay.innerHTML = `<div class="panel">${html}</div>`; overlay.classList.remove('hidden'); }
function hideOverlay() { overlay.classList.add('hidden'); }

function titleScreen() {
  state = 'title'; $('hud').classList.add('hidden'); unlock();
  showOverlay(`
    <h1>🥚 달걀 도둑 농장 3D</h1>

function startGame() {
  goFarm(); P.invuln = 0;
  hideOverlay(); $('hud').classList.remove('hidden'); state = 'play'; lock();
  if (IS_TOUCH) {   // 모바일: 전체 화면으로 (지원하는 브라우저만)
    // 전체 화면이 되면 안드로이드는 화면 자체를 가로로 고정 (안 되면 위의 90° 돌리기로 가로)
    try {
      const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      if (r && r.then) r.then(() => { if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape'); }).catch(() => {});
    } catch (e) {}
  }
  if (offlineEarned >= 1) { toast(`없는 동안 농장이 ${fmt(offlineEarned)} 💰을 벌었어요!`, 3); offlineEarned = 0; }
  else toast('➡ 오비를 깨고 둥지의 달걀을 훔쳐 오자!', 2.5);
  buildBar();
}
function resume() { hideOverlay(); state = 'play'; lock(); }
function openShop() { state = 'shop'; unlock(); renderShop(); }
function renderShop() {
  const items = WINGS.map(w => {
    const owned = SAVE.wings.includes(w.id), eq = SAVE.equip === w.id;
    const btn = !owned ? `<button class="btn" ${SAVE.money < w.price ? 'disabled' : ''} onclick="buyWing('${w.id}')">${fmt(w.price)}원</button>`
      : eq ? '<button class="btn gray" disabled>장착 중</button>' : `<button class="btn gray" onclick="equipWing('${w.id}')">장착</button>`;
    return `<div class="item"><div><span class="wingIcon" style="background:${w.css}"></span><b>${w.name}</b><br>
      <span style="font-size:13px;color:#cfd3ea">${w.dur}초 동안 비행</span></div>${btn}</div>`;
  }).join('');
  showOverlay(`<h2>🪽 날개 상점</h2><p>보유: <b style="color:#ffd23f">${fmt(SAVE.money)}원</b></p><div class="shop">${items}</div>
    <p style="font-size:13px;margin-top:12px"><b>Shift+Space</b> 또는 오른쪽 <b>🪽 버튼</b> → 비행 시작 · 게임 시간 <b>하루에 3번</b>까지 (아침에 충전)<br>
    달걀을 들고 있거나 드는 중에는 날 수 없어요<br>
    비행 중 <b>Space</b> 또는 <b>내리기</b> 버튼 → 날개가 사라지며 비행 중단</p>
    <button class="btn gray" onclick="resume()">닫기</button>`);
}
function buyWing(id) {
  const w = WINGS.find(x => x.id === id);
  if (SAVE.wings.includes(id) || SAVE.money < w.price) return;
  SAVE.money -= w.price; SAVE.wings.push(id); SAVE.equip = id; sfx('buy'); save(); renderShop();
}
function equipWing(id) { SAVE.equip = id; save(); renderShop(); }

// ---------- 인벤토리 (100칸) ----------
const itemName = it => it.kind === 'pet' ? animalOf(it.lv, it.g).name : (it.g === SECRET ? '드래곤 에그' : `${BIOMES[it.lv]} 알`);
const itemIcon = it => it.kind === 'pet' ? `<div class="ico">${EMOJI[animalOf(it.lv, it.g).type]}</div>` : eggHTML(it.lv, it.g);
const priceOf = it => it.kind === 'pet' ? animalOf(it.lv, it.g).inc * PET_PRICE_MULT : (it.g === SECRET ? SECRET_EGG_PRICE : EGG_PRICE[it.lv]);
const freeSlot = () => { for (let i = 0; i < SLOTS; i++) if (!SAVE.slots[i]) return i; return -1; };
function pickPenItem({ i, v }) {
  if (SAVE.inv.length >= INV_MAX) { toast('🎒 인벤토리가 가득 찼어요 (100칸)', 1.5); return; }
  const s = SAVE.slots[i];
  const it = v.kind === 'baby' ? { kind: 'pet', lv: s.lv, g: s.g } : { kind: 'egg', lv: s.lv, g: s.g, prog: progNow(s) };
  SAVE.inv.push(it); SAVE.slots[i] = null;
  save(); rebuildFarm(); sfx('pick');
  toast(`🎒 ${itemName(it)}을(를) 인벤토리에 넣었어요`, 1.6);
}
let invSel = -1, invMsg = '';
function openInv() { if (state !== 'play') return; state = 'inv'; unlock(); invSel = -1; invMsg = ''; renderInv(); }
function selInv(i) { invSel = i; invMsg = ''; renderInv(); }
function renderInv() {
  const cells = Array.from({ length: INV_MAX }, (_, i) => {
    const it = SAVE.inv[i];
    return `<div class="invCell${it ? ' has' : ''}${i < HOT_N ? ' hot' : ''}${i === invSel ? ' sel' : ''}" ${it ? `onclick="selInv(${i})"` : ''}>
      <span class="invNo">${i + 1}</span>${it ? itemIcon(it) + `<div class="invName">${itemName(it)}</div>
      <button class="cellBtn" onclick="event.stopPropagation();placeFromInv(${i})">🐣 우리에 놓기</button>` : ''}</div>`;
  }).join('');
  let detail = '<span style="color:#9aa">아이템을 클릭하면 정보가 보여요 · 파란 1~9번 칸은 아래 핫바에 나와요 · 우리 안에서 펫이나 알 앞에서 <b>E</b>를 누르면 인벤토리에 들어와요</span>';
  const it = SAVE.inv[invSel];
  if (it) {
    const a = animalOf(it.lv, it.g);
    detail = `${itemIcon(it)}<div><b style="font-size:18px">${itemName(it)}</b><br>
      ${it.kind === 'pet' ? `초당 ${fmt(a.inc)}원 (우리에 있을 때만)` : `부화까지 ${minSec(a.ht - it.prog)} (우리에 있을 때만 자라요)`} · 판매가 <b style="color:#ffd23f">${fmt(priceOf(it))}원</b><br>
      <button class="btn" onclick="placeFromInv(${invSel})">🐣 우리에 놓기</button>
      <span style="font-size:12px;color:#9aa;margin-left:8px">판매는 💰 판매 상점에서만 가능해요</span>
      ${invMsg ? `<div style="color:#ff8080">${invMsg}</div>` : ''}</div>`;
  }
  overlay.innerHTML = `<div class="invFull"><div class="invHead"><h2 style="margin:0">🎒 인벤토리 (${SAVE.inv.length}/${INV_MAX})</h2>
    <button class="btn gray" onclick="resume()">닫기 (M)</button></div><div class="invDetail">${detail}</div><div class="invGrid">${cells}</div></div>`;
  overlay.classList.remove('hidden');
}
// ---------- 핫바 (10칸) ----------
// 1~9번 칸은 인벤토리 1~9번 칸을 그대로 보여주고, 10번 칸은 인벤토리(100칸)를 연다
const HOT_N = 9;
let hotSel = 0, hotKey = '';
function selHot(i) { hotSel = i; hotKey = ''; renderHotbar(); }
function renderHotbar() {
  const key = hotSel + '|' + SAVE.inv.slice(0, HOT_N).map(it => it.kind + it.lv + '-' + it.g).join(',');
  if (key === hotKey) return;
  hotKey = key;
  let html = '';
  for (let i = 0; i < HOT_N; i++) {
    const it = SAVE.inv[i];
    html += `<button class="hotCell${i === hotSel ? ' sel' : ''}" onclick="selHot(${i})" title="${it ? itemName(it) : '빈 칸'} (${i + 1})">
      <span class="hotNo">${i + 1}</span>${it ? itemIcon(it) : ''}</button>`;
  }
  html += `<button id="bagBtn" class="hotCell" title="인벤토리 (M / 0)" onclick="openInv()"><span class="hotNo">0</span>🎒</button>`;
  $('hotbar').innerHTML = html;
  const it = SAVE.inv[hotSel];
  $('hotName').classList.toggle('hidden', !it);
  if (it) $('hotName').textContent = itemName(it);
}
// 인벤토리 i번 아이템을 우리 idx번 칸에 놓기
function placeInvAt(i, idx) {
  const it = SAVE.inv[i]; if (!it || SAVE.slots[idx]) return;
  SAVE.slots[idx] = it.kind === 'pet'
    ? newSlot(it.lv, it.g, animalOf(it.lv, it.g).ht + 1)   // 이미 태어난 펫
    : newSlot(it.lv, it.g, it.prog);                       // 자라던 만큼 이어서
  SAVE.inv.splice(i, 1);
  save(); rebuildFarm(); sfx('pick');
  if (state === 'play') toast(`🐣 ${itemName(it)}을(를) ${idx + 1}번 칸에 놓았어요`, 1.6);
}
function placeFromInv(i) {
  if (!SAVE.inv[i]) return;
  const idx = freeSlot();
  if (idx < 0) { invSel = i; invMsg = '우리가 가득 찼어요 (18칸)'; renderInv(); return; }
  placeInvAt(i, idx); invSel = -1; renderInv();
}

// ---------- 판매 상점 (펫·알 팔기) ----------
function openSell() { state = 'shop'; unlock(); renderSell(); }
function renderSell() {
  let rows = '';
  if (P.held) {
    const h = { kind: 'egg', lv: P.held.lv, g: P.held.g };
    rows += `<div class="item"><div style="display:flex;align-items:center;gap:10px">${itemIcon(h)}<div><b>${itemName(h)}</b> <span style="color:#9aa">(들고 있는 알)</span></div></div>
      <button class="btn" onclick="sellHeld()">${fmt(priceOf(h))}원에 팔기</button></div>`;
  }
  SAVE.inv.forEach((it, i) => {
    rows += `<div class="item"><div style="display:flex;align-items:center;gap:10px">${itemIcon(it)}<div><b>${itemName(it)}</b><br>
      <span style="font-size:12px;color:#9aa">${it.kind === 'pet' ? '펫' : '알'}</span></div></div>
      <button class="btn" onclick="sellInv(${i})">${fmt(priceOf(it))}원에 팔기</button></div>`;
  });
  const total = SAVE.inv.reduce((a, it) => a + priceOf(it), 0);
  showOverlay(`<h2>💰 판매 상점</h2><p>보유: <b style="color:#ffd23f">${fmt(SAVE.money)}원</b></p>
    <div class="shop">${rows || '<p>팔 수 있는 펫이나 알이 없어요.<br>우리 안에서 펫·알 앞에서 <b>E</b>를 누르면 인벤토리에 들어와요.</p>'}</div>
    ${SAVE.inv.length ? `<button class="btn" onclick="sellAll()">인벤토리 전부 팔기 (${fmt(total)}원)</button>` : ''}
    <button class="btn gray" onclick="resume()">닫기</button>`);
}
function sellInv(i) {
  const it = SAVE.inv[i]; if (!it) return;
  SAVE.money += priceOf(it); SAVE.inv.splice(i, 1); sfx('buy'); save(); renderSell();
}
function sellAll() {
  SAVE.money += SAVE.inv.reduce((a, it) => a + priceOf(it), 0); SAVE.inv = []; sfx('buy'); save(); renderSell();
}
function sellHeld() {
  if (!P.held) return;
  SAVE.money += priceOf({ kind: 'egg', lv: P.held.lv, g: P.held.g });
  P.held = null; playerModel.holder.clear(); sleepBoss(); sfx('buy'); save(); renderSell();
}
function pauseGame() {
  state = 'paused';
  showOverlay(`<h2>⏸ 일시정지</h2><button class="btn" onclick="resume()">계속하기</button><button class="btn gray" onclick="save();titleScreen()">처음 화면</button>`);
}

function buildBar() {
  document.querySelectorAll('.barNest').forEach(e => e.remove());
  const span = mapEnd - FARM_X0;
  $('barFarm').style.width = (-FARM_X0 / span * 100) + '%';

}
function updateHUD() {
  const span = mapEnd - FARM_X0, pct = x => Math.max(0, Math.min(100, (x - FARM_X0) / span * 100)) + '%';
  const zone = P.pos.x < 0 ? -1 : P.pos.x >= levelStarts[2] ? 2 : P.pos.x >= levelStarts[1] ? 1 : 0;
  $('hStage').textContent = zone < 0 ? '🏡 내 농장' : `${LEVELS[zone].emoji} ${LEVELS[zone].name}`;
  if (!B) $('hStatus').textContent = '😴 보스들은 쿨쿨 자는 중';
  else if (B.state === 'waking') $('hStatus').textContent = `${B.L.emoji} ${B.L.boss}: 😳 깨어나는 중!`;
  else $('hStatus').textContent = `${B.L.emoji} ${B.L.boss}: 🚨 추격 중! 거리 ${Math.round(Math.hypot(P.pos.x - B.x, P.pos.z - B.z))}m`;
  const cp = cyclePos(Date.now());
  $('hTime').innerHTML = night
    ? `🌙 <b>밤</b> · 방벽! ${Math.ceil(CYCLE - cp)}초 후 새 달걀 <span style="color:#b8c8ff">(달걀 성장 ×3)</span>`
    : `☀️ <b>낮</b> · 달걀 리셋까지 ${mmss(DAY - cp)}`;
  $('barMe').style.left = pct(P.pos.x);
  $('barBoss').classList.toggle('hidden', !B);
  if (B) $('barBoss').style.left = pct(B.x);
  $('hMoney').textContent = `💰 ${fmt(SAVE.money)}원`;
  $('hIncome').textContent = `초당 +${fmt(totalIncome())}원`;
  const used = SAVE.slots.filter(Boolean).length;
  $('hFarm').textContent = `🏡 부화 칸 ${used}/${SLOTS}` + (NET.ready ? ` · 🌐 ${netCount()}명` : '');
  renderHotbar();
  $('hpFill').style.width = (P.hp / MAX_HP * 100) + '%';
  $('hpFill').style.background = P.hp >= 70 ? '#3ccf4e' : P.hp >= 50 ? '#ffd23f' : '#ff3b3b';
  $('hpText').textContent = Math.round(P.hp);
  const w = curWing();
  $('hFly').textContent = w ? `🪽 ${w.name} 오늘 ${flyLeft()}/${FLY_PER_DAY}회 남음` : '';
  $('jumpBanner').classList.toggle('hidden', !P.held);
  $('btnDrop').classList.toggle('hidden', !P.held);
  const fb = $('btnFly'), fl = P.flying > 0;
  fb.classList.toggle('hidden', !w);
  fb.classList.toggle('land', fl);

  if (w) fb.innerHTML = fl ? '<b>⬇</b>내리기' : `<b>🪽</b>날기 ${flyLeft()}/${FLY_PER_DAY}`;

  if (P.flying > 0) $('flyBar').innerHTML = `🪽 비행 중 ${P.flying.toFixed(1)}초<div class="pbar"><div style="width:${P.flying / P.flyMax * 100}%"></div></div>`;

  $('vignette').style.opacity = B ? Math.max(0, 1 - d / 18) : 0;
}

// 낮/밤 전환 체크
function updateDayNight() {
  const now = Date.now(), nNow = isNightAt(now), ci = cycleIndex(now);
  if (nNow !== night) {
    night = nNow;
    barrier.visible = night;
    if (night) {
      clearGroundEggs();   // 밤이 되면 내려놓은 달걀도 리셋
      const had = P.held || P.pick;
      if (P.held) { P.held = null; playerModel.holder.clear(); sleepBoss(); }
      P.pick = null;
      if (state !== 'title') {
        sfx('night');
        // 오비·둥지 쪽에 있으면 농장으로 순간이동, 들고 있던(들던) 달걀은 사라짐
        if (P.pos.x > barrierC.cx) {
          goFarm();
          toast(had ? '🌙 밤이 되어 농장으로 돌아왔어요\n가지고 있던 달걀이 사라졌어요...' : '🌙 밤이 되어 농장으로 돌아왔어요', 3);
        } else toast(had ? '🌙 밤이 되어 가지고 있던 달걀이 사라졌어요' : '🌙 밤이 되었다!\n방벽이 생겼어요 (달걀이 3배 빨리 자라요)', 2.8);
      }
    }
  }
  if (ci !== lastCycle) {     // 밤이 끝나고 아침 → 달걀 새로 스폰
    lastCycle = ci;
    respawnAllEggs();
    if (state !== 'title') toast('☀️ 아침! 둥지에 새 달걀이 생겼어요', 2.5);
  }
}

// =====================================================================
//  메인 루프
// =====================================================================
const clock = new THREE.Clock();
let hudTick = 0, saveTick = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  T += dt;
  updateDayNight();
  updateMovers(dt, T);
  for (const n of nests) for (const e of n.eggs) {
    if (e.taken) continue;
    e.mesh.rotation.y += dt * 0.8; e.mesh.position.y = e.pos.y + Math.sin(T * 2 + e.ph) * 0.04;
    if (e.aura) { e.aura.position.y = e.mesh.position.y; e.aura.material.opacity = 0.65 + Math.sin(T * 4 + e.ph) * 0.35; e.aura.scale.setScalar(2.2 + Math.sin(T * 3) * 0.3); }
  }
  if (barrier.visible) barrier.material.opacity = 0.45 + Math.sin(T * 6) * 0.15;
  animateSleepers(T);
  if (embers) {
    const a = embers.geometry.attributes.position;
    for (let i = 0; i < a.count; i++) { let y = a.getY(i) + dt * 2; if (y > 30) y = -12; a.setY(i, y); }
    a.needsUpdate = true;
  }
  updateFarm(dt);
  updateOthers(dt);
  NET.tick(dt);
  SAVE.money += totalIncome() * dt;
  if (state === 'play') {
    updatePlayer(dt);
    if (state === 'play') updateBoss(dt);
    hudTick -= dt; if (hudTick <= 0) { hudTick = 0.1; updateHUD(); }
  }
  saveTick -= dt; if (saveTick <= 0) { saveTick = 5; save(); }
  if (playerModel.holder.children[0]) playerModel.holder.children[0].rotation.y += dt * 2;
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $('toast').style.opacity = 0; }
  if (secretTimer > 0) { secretTimer -= dt; if (secretTimer <= 0) $('secretBanner').classList.add('hidden'); }
  updateCamera(dt);
  renderer.render(scene, camera);
}

// =====================================================================
//  온라인 (최대 5명) — 페이지를 열기만 하면 자동으로 같은 방에 들어감
//  공개 MQTT 중계 서버를 통해 메시지를 주고받음 (서버 주소 입력 필요 없음)
//  각자 돈·인벤토리·우리는 자기 브라우저에 저장되고, 위치·우리 모습·둥지 달걀 상태만 서로 공유
// =====================================================================
const NET_BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const NET_TOPIC = 'eggthief3d/avocado-kr--1/v1/room';
const PEN_ORDER = [2, 1, 3, 0, 4];   // 가운데 우리부터 채움
const others = new Map();            // id → { name, pen, j, slots, model, tag, tgt, face, h, w, heldKey, anim, seen }
const penOwner = k => { for (const o of others.values()) if (o.pen === k) return o; return null; };
const NET = {
  client: null, on: false, ready: false, id: 'u' + Math.random().toString(36).slice(2, 10), j: 0, name: netName(), sendT: 0, status: '🌐 연결 중...',
  send(m) {
    if (!this.on || !this.ready || !this.client) return;
    m.id = this.id;
    try { this.client.publish(NET_TOPIC, JSON.stringify(m)); } catch (e) {}
  },
  start() {
    this.name = netName();
    if (typeof mqtt === 'undefined') { this.setStatus('🔌 온라인에 연결할 수 없어요 (혼자 하기)'); return; }
    this.tryBroker(0);
  },
  tryBroker(bi) {
    if (bi >= NET_BROKERS.length) { this.setStatus('🔌 온라인에 연결할 수 없어요 (혼자 하기)'); return; }
    let c;
    try {
      c = mqtt.connect(NET_BROKERS[bi], { clientId: 'egt_' + this.id, connectTimeout: 6000, reconnectPeriod: 3000, keepalive: 30, clean: true,
        will: { topic: NET_TOPIC, payload: JSON.stringify({ t: 'bye', id: this.id }), qos: 0, retain: false } });
    } catch (e) { this.tryBroker(bi + 1); return; }
    let connected = false;
    const fail = setTimeout(() => { if (!connected) { c.end(true); this.tryBroker(bi + 1); } }, 7000);
    c.on('connect', () => {
      const first = !connected; connected = true; clearTimeout(fail);
      this.client = c; this.on = true;
      c.subscribe(NET_TOPIC);
      if (first) { this.j = Date.now(); this.setStatus('🌐 방에 들어가는 중...'); setTimeout(netClaimPen, 1500); }
      else if (this.ready) { this.send({ t: 'hello' }); netReadyStatus(); }   // 다시 연결됨
    });
    c.on('message', (topic, buf) => { let m; try { m = JSON.parse(buf.toString()); } catch (e) { return; } netMsg(m); });
    c.on('offline', () => { if (connected && this.on) this.setStatus('🔌 연결이 끊겼어요... 다시 연결 중'); });
  },
  leave(msg) {   // 방이 가득 참 → 혼자 하기
    this.ready = false; this.on = false;
    try { this.client.end(true); } catch (e) {}
    for (const id of [...others.keys()]) removeOther(id);
    this.setStatus(msg);
  },
  tick(dt) {
    if (!this.ready) return;
    // 5초 동안 소식이 없는 플레이어는 나간 것으로 봄
    const now = Date.now();
    for (const o of [...others.values()]) if (now - o.seen > 5000) removeOther(o.id);
    this.sendT -= dt; if (this.sendT > 0) return;
    this.sendT = 0.15;
    const w = P.flying > 0 && curWing();
    this.send({ t: 'st', name: this.name, pen: myPen, j: this.j, x: +P.pos.x.toFixed(2), y: +P.pos.y.toFixed(2), z: +P.pos.z.toFixed(2), f: +P.face.toFixed(2),
      h: P.held ? P.held.lv * 10 + P.held.g : -1, w: w ? w.color : 0 });
  },
  setStatus(s) { this.status = s; const el = $('netStatus'); if (el) el.textContent = s; },
};
const netCount = () => others.size + 1;
function netReadyStatus() { NET.setStatus(`🌐 온라인: 지금 ${netCount()}명 접속 중 · 내 우리 ${myPen + 1}번`); }
const freePen = () => { const used = new Set([...others.values()].map(o => o.pen)); return PEN_ORDER.find(k => !used.has(k)); };
// 접속 후 1.5초 동안 다른 사람들을 확인하고 빈 우리를 차지
function netClaimPen() {
  const pen = freePen();
  if (pen === undefined) { NET.leave('🚫 방이 가득 찼어요 (최대 5명) — 혼자 하기로 해요'); return; }
  setMyPen(pen);
  NET.ready = true;
  NET.send({ t: 'hello' });
  NET.send({ t: 'pen', slots: SAVE.slots });
  netReadyStatus();
  if (state !== 'title') toast(`🌐 온라인 접속! ${myPen + 1}번 우리가 내 우리예요\n(지금 ${netCount()}명)`, 3);
}
function setMyPen(k) {
  if (k !== myPen) {
    myPen = k; recolorPlayer();
    if (state === 'title' || (P.pos.x < 0 && !P.held)) { P.pos.copy(farmSpawn()); P.vel.set(0, 0, 0); }
  }
  rebuildAllPens();
}
function netMsg(m) {
  if (!m || typeof m.id !== 'string' || m.id === NET.id || typeof m.t !== 'string') return;
  let o = others.get(m.id);
  if (m.t === 'st') {
    if (!(m.pen >= 0 && m.pen < PEN_N) || !isFinite(m.x) || !isFinite(m.y) || !isFinite(m.z)) return;
    if (!o) {
      if (others.size >= PEN_N - 1) return;
      o = addOther(m);
      if (NET.ready) { rebuildPen(o.pen); drawPenSigns(); toast(`👋 ${o.name}님이 들어왔어요`, 2); netReadyStatus(); }
    }
    o.seen = Date.now();
    if (o.pen !== m.pen) { const old = o.pen; o.pen = m.pen; o.slots = []; recolor(o.model, PEN_COLORS[o.pen]); setTag(o); rebuildPen(old); rebuildPen(o.pen); drawPenSigns(); }
    const nm = String(m.name || '').slice(0, 10);
    if (nm && nm !== o.name) { o.name = nm; setTag(o); drawPenSigns(); }
    applyState(o, m);
    // 같은 우리를 두 사람이 고름 → 늦게 들어온 사람이 다른 빈 우리로 옮김
    if (NET.ready && m.pen === myPen && (m.j < NET.j || (m.j === NET.j && m.id < NET.id))) {
      const free = freePen();
      if (free === undefined) NET.leave('🚫 방이 가득 찼어요 (최대 5명) — 혼자 하기로 해요');
      else { setMyPen(free); NET.send({ t: 'pen', slots: SAVE.slots }); netReadyStatus(); }
    }
    return;
  }
  if (!NET.ready) return;
  if (m.t === 'bye') { if (o) { toast(`👋 ${o.name}님이 나갔어요`, 2); removeOther(m.id); } }
  else if (m.t === 'hello') {
    // 새로 온 사람에게 내 우리 + (가장 먼저 온 사람이) 둥지 달걀 상태를 알려 줌
    NET.send({ t: 'pen', slots: SAVE.slots });
    const oldest = [...others.values()].every(x => x.id === m.id || x.j > NET.j);
    if (oldest) NET.send({ t: 'world', to: m.id, c: lastCycle,
      taken: nests.flatMap(n => n.eggs.filter(e => e.taken).map(e => ({ lv: n.lv, i: e.idx }))),
      grounds: groundEggs.map(e => ({ gid: e.id, lv: e.n.lv, g: e.g, i: e.origin.idx, x: e.pos.x, y: e.pos.y - EGG_SCALE * 1.05, z: e.pos.z })) });
  }
  else if (m.t === 'world' && m.to === NET.id && m.c === lastCycle) {
    (m.taken || []).forEach(t => applyTake({ c: m.c, lv: t.lv, i: t.i }));
    (m.grounds || []).forEach(gd => applyGdrop(Object.assign({ c: m.c }, gd)));
  }
  else if (m.t === 'pen' && o) { o.slots = Array.isArray(m.slots) ? m.slots.slice(0, SLOTS) : []; rebuildPen(o.pen); }
  else if (m.t === 'take') applyTake(m);
  else if (m.t === 'ret') {
    const e = m.c === lastCycle && nests[m.lv] && nests[m.lv].eggs[m.i];
    if (e && e.taken && !(P.held && P.held.e === e)) returnToNest(e, true);
  }
  else if (m.t === 'gdrop') applyGdrop(m);
  else if (m.t === 'gtake') {
    const ge = groundEggs.find(x => x.id === m.gid);
    if (ge) { hideEgg(ge); removeGroundEgg(ge); }
  }
}
function recolor(model, color) {
  const c = new THREE.Color(color);
  model.body[0].color.copy(c); model.body[1].color.copy(c).offsetHSL(0, 0, 0.1); model.body[2].color.copy(c).offsetHSL(0, 0, -0.15);
}
function recolorPlayer() { recolor(playerModel, PEN_COLORS[myPen]); }
function setTag(o) {
  if (o.tag) scene.remove(o.tag);
  const css = '#' + new THREE.Color(PEN_COLORS[o.pen]).offsetHSL(0, 0, 0.15).getHexString();
  o.tag = textSprite([{ text: o.name, font: 'bold 52px Malgun Gothic', color: css, y: 64 }], 512, 128, 2.6, false);
  scene.add(o.tag);
}
function addOther(m) {
  const model = makePerson(PEN_COLORS[m.pen]);
  const o = { id: m.id, name: String(m.name || '플레이어').slice(0, 10), pen: m.pen, j: +m.j || 0, slots: [], model, tag: null,
    tgt: new THREE.Vector3(m.x, m.y, m.z), face: 0, h: -1, w: 0, heldKey: -1, anim: 0, seen: Date.now() };
  model.g.position.copy(o.tgt);
  setTag(o);
  others.set(m.id, o);
  return o;
}
function removeOther(id) {
  const o = others.get(id); if (!o) return;
  scene.remove(o.model.g); scene.remove(o.tag); others.delete(id);
  rebuildPen(o.pen); drawPenSigns();
  if (NET.ready) netReadyStatus();
}
function applyState(o, s) {
  o.tgt.set(s.x, s.y, s.z); o.face = +s.f || 0; o.j = +s.j || o.j;
  o.h = Number.isInteger(s.h) && s.h >= 0 && s.h < 30 ? s.h : -1; o.w = +s.w || 0;
}
function applyTake(m) {
  if (m.c !== lastCycle) return;
  const e = nests[m.lv] && nests[m.lv].eggs[m.i];
  if (e && !e.taken) hideEgg(e);
}
function applyGdrop(m) {
  if (m.c !== lastCycle || !m.gid || groundEggs.some(x => x.id === m.gid)) return;
  const n = nests[m.lv]; if (!n || !n.eggs[m.i] || !EGGS[m.lv] || !EGGS[m.lv][m.g] || !isFinite(m.x)) return;
  spawnGroundEgg({ lv: m.lv, g: m.g, n, e: n.eggs[m.i] }, m.x, m.y, m.z, m.gid);
}
// 다른 플레이어 움직임 (0.15초마다 오는 위치 사이를 부드럽게 이어 줌)
function updateOthers(dt) {
  for (const o of others.values()) {
    const pm = o.model, g = pm.g;
    const dx = o.tgt.x - g.position.x, dz = o.tgt.z - g.position.z, d = Math.hypot(dx, dz);
    if (d > 12) g.position.copy(o.tgt);
    else g.position.lerp(o.tgt, Math.min(1, dt * 10));
    let diff = o.face - g.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    g.rotation.y += diff * Math.min(1, dt * 12);
    const moving = d > 0.05 && Math.abs(o.tgt.y - g.position.y) < 0.2;
    o.anim += dt * (moving ? 11 : 0);
    const sw = moving ? Math.sin(o.anim) * 0.9 : 0;
    pm.legs[0].rotation.x = sw; pm.legs[1].rotation.x = -sw;
    const up = o.h >= 0;
    pm.arms[0].rotation.x = up ? Math.PI : -sw; pm.arms[1].rotation.x = up ? Math.PI : sw;
    if (o.heldKey !== o.h) {   // 들고 있는 달걀 모양 바뀜
      o.heldKey = o.h; pm.holder.clear();
      if (o.h >= 0) {
        const lv = Math.floor(o.h / 10), gr = o.h % 10;
        if (EGGS[lv] && EGGS[lv][gr]) { pm.holder.add(makeEggMesh(lv, gr)); if (gr === SECRET) pm.holder.add(halo(0xff4dd2, 1.6)); }
      }
    }
    if (pm.holder.children[0]) pm.holder.children[0].rotation.y += dt * 2;
    pm.wingG.visible = !!o.w;
    if (o.w) { pm.wingMat.color.setHex(o.w); pm.wl.forEach((p, k) => { p.rotation.z = (k ? -1 : 1) * Math.sin(T * 14) * 0.5; }); }
    o.tag.position.set(g.position.x, g.position.y + (up ? 3.0 : 2.4), g.position.z);
  }
}
// 이름 (안 정하면 자동으로 "농부 123")
const NAME_KEY = 'eggthief_name';
function netName() {
  let n = ''; try { n = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}
  if (!n) { n = '농부 ' + Math.floor(100 + Math.random() * 900); try { localStorage.setItem(NAME_KEY, n); } catch (e) {} }
  return n;
}
function setNetName(v) {
  v = String(v || '').trim().slice(0, 10); if (!v) return;
  NET.name = v; try { localStorage.setItem(NAME_KEY, v); } catch (e) {}
  drawPenSigns();
}
addEventListener('beforeunload', () => { if (NET.ready) NET.send({ t: 'bye' }); });

addEventListener('beforeunload', save);
loadSave();
buildWorld();
barrier.visible = night;
respawnAllEggs();
rebuildFarm();
playerModel.g.position.copy(P.pos);
titleScreen();
NET.start();   // 페이지를 열면 자동으로 온라인 방에 접속
loop();
</script>
