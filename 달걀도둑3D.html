<title>달걀 도둑 농장 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; color: #fff; user-select: none; }
  canvas { display: block; }
  .hidden { display: none !important; }

  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hudL { position: absolute; top: 14px; left: 14px; background: rgba(0,0,0,.45); padding: 10px 14px; border-radius: 12px; min-width: 260px; }
  #hStage { font-size: 17px; font-weight: bold; }
  #hStatus { font-size: 15px; margin-top: 4px; }
  #hTime { font-size: 14px; margin-top: 4px; }
  #bar { position: relative; height: 10px; margin-top: 8px; background: rgba(255,255,255,.15); border-radius: 5px; }
  #barFarm { position: absolute; top: 0; left: 0; height: 10px; background: #5fbf4a; border-radius: 5px 0 0 5px; }
  #barMe, #barBoss { position: absolute; top: -3px; width: 8px; height: 16px; border-radius: 3px; transform: translateX(-50%); }
  #barMe { background: #ddd; }
  #barBoss { background: #ff3b3b; }
  .barNest { position: absolute; top: 1px; width: 8px; height: 8px; border-radius: 50%; transform: translateX(-50%); background: #ffcc33; }
  #hudR { position: absolute; top: 14px; right: 14px; background: rgba(0,0,0,.45); padding: 10px 16px; border-radius: 12px; text-align: right; }
  #hpWrap { display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 12px; font-weight: bold; margin-bottom: 6px; }
  #hpBar { width: 120px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.18); overflow: hidden; }
  #hpFill { height: 100%; width: 100%; background: #3ccf4e; transition: width .2s, background .2s; }
  #hMoney { font-size: 26px; font-weight: bold; color: #ffd23f; }
  #hIncome { font-size: 13px; color: #b8ffb0; }
  #hFarm { font-size: 13px; margin-top: 4px; }

  /* 달걀을 들었을 때 위에 뜨는 빨간 박스 */
  #jumpBanner { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); padding: 10px 34px; border-radius: 14px;
    background: linear-gradient(180deg, #ff6b6b 0%, #e01e1e 55%, #8a0000 100%); border: 2px solid #3a0000;
    font-size: 28px; font-weight: 900; color: #fff; -webkit-text-stroke: 1.5px #000; paint-order: stroke fill;
    text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  #secretBanner { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); padding: 10px 26px; border-radius: 14px;
    background: linear-gradient(90deg, #6a1fb0, #ff4dd2, #ffb000); font-size: 20px; font-weight: bold; white-space: nowrap;
    text-shadow: 0 0 4px #000, 0 0 2px #000; box-shadow: 0 0 24px #ff4dd2; }
  #toast { position: absolute; top: 24%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: bold; text-shadow: 0 2px 8px #000, 0 0 3px #000; text-align: center; opacity: 0; transition: opacity .3s; white-space: pre-line; }
  #prompt { position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: bold; background: rgba(0,0,0,.6); padding: 10px 20px; border-radius: 14px; border: 2px solid #fff; white-space: nowrap; text-align: center; }
  #prompt .pbar { margin-top: 8px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.2); overflow: hidden; }
  #prompt .pbar div { height: 100%; background: #fff; }
  /* 아래 핫바 10칸: 1~9번 = 인벤토리 1~9번 칸, 10번 = 인벤토리 열기 */
  #hotbar { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; pointer-events: auto;
    background: rgba(0,0,0,.35); padding: 4px; border-radius: 14px; }
  .hotCell { position: relative; width: min(52px, calc(8.4 * var(--vw, 1vw))); height: min(52px, calc(8.4 * var(--vw, 1vw))); border-radius: 10px; border: 2px solid rgba(255,255,255,.35);
    background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; cursor: pointer; font-family: inherit; color: #fff; padding: 0; }
  .hotCell:hover { background: rgba(0,0,0,.65); }
  .hotCell.sel { border-color: #ffcc33; box-shadow: 0 0 8px #ffcc33; }
  .hotCell .ico { font-size: min(28px, calc(5 * var(--vw, 1vw))); }
  .hotCell .egg { width: min(24px, calc(4.4 * var(--vw, 1vw))); height: min(32px, calc(5.8 * var(--vw, 1vw))); }
  .hotNo { position: absolute; top: 1px; left: 4px; font-size: 10px; color: #ccd; }
  #bagBtn { font-size: min(28px, calc(5 * var(--vw, 1vw))); line-height: 1; border-color: rgba(255,255,255,.6); }
  #hotName { position: absolute; bottom: 78px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: bold; background: rgba(0,0,0,.5);
    padding: 3px 12px; border-radius: 8px; white-space: nowrap; }
  .invCell.hot { border-color: rgba(120,200,255,.45); background: rgba(120,200,255,.08); }
  /* 화면을 꽉 채우는 인벤토리 */
  .invFull { position: fixed; inset: 0; background: linear-gradient(160deg, #2b2f4a, #141626); overflow-y: auto; padding: 0 24px 40px; }
  .invHead { display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: #23273f; padding: 14px 0 10px; z-index: 2; }
  .invHead .btn { margin: 0; }
  .invDetail { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.06); border-radius: 12px; padding: 12px 16px; margin: 10px 0 16px; min-height: 84px; text-align: left; line-height: 1.6; }
  .invDetail .btn { margin: 6px 0 0; padding: 8px 16px; font-size: 15px; }
  .invGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
  .invCell { position: relative; aspect-ratio: 1; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.1); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; }
  .invCell.has { cursor: pointer; }
  .invCell.has:hover { background: rgba(255,255,255,.13); }
  .invCell.sel { border-color: #ffcc33; }
  .invCell .egg { width: 30px; height: 40px; }
  .ico { font-size: 36px; line-height: 1; }
  .invName { margin-top: 4px; text-align: center; padding: 0 4px; }
  .invNo { position: absolute; top: 4px; left: 6px; font-size: 10px; color: #778; }
  .cellBtn { margin-top: 4px; padding: 3px 6px; font-size: 11px; font-weight: bold; border: none; border-radius: 8px; background: #ffcc33; color: #3a2a00; cursor: pointer; font-family: inherit; }
  .cellBtn:hover { filter: brightness(1.1); }
  #vignette { position: absolute; inset: 0; box-shadow: inset 0 0 160px 40px rgba(255,0,0,.55); opacity: 0; transition: opacity .25s; }
  #flyBar { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); width: 220px; background: rgba(0,0,0,.55); border-radius: 10px; padding: 6px 10px; font-size: 14px; text-align: center; }
  #flyBar .pbar { margin-top: 4px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.2); overflow: hidden; }
  #flyBar .pbar div { height: 100%; background: #9fe3ff; }
  .hudBtn { position: absolute; right: 14px; pointer-events: auto; padding: 10px 18px; font-size: 16px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; font-family: inherit; color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  /* 오른쪽 가운데 살짝 아래 — 눌러서 날기 */
  #btnFly { position: absolute; right: 18px; top: 56%; transform: translateY(-50%); pointer-events: auto; width: 84px; height: 84px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.75); background: radial-gradient(circle at 35% 30%, #8fd8ff, #2f7fd0); color: #fff; font-family: inherit;
    font-size: 13px; font-weight: bold; cursor: pointer; line-height: 1.15; box-shadow: 0 5px 0 rgba(0,0,0,.35); text-shadow: 0 1px 2px #000; }
  #btnFly b { display: block; font-size: 30px; }
  #btnFly:active { transform: translateY(calc(-50% + 3px)); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  #btnFly.off { filter: grayscale(1); opacity: .6; }
  #btnFly.land { background: radial-gradient(circle at 35% 30%, #ffc58f, #d06a2f); }
  /* 날기 버튼 바로 아래 — 달걀 모양 버튼: 내 우리의 동물과 초당 수입 보기 */
  #btnPen { position: absolute; right: 28px; top: calc(56% + 54px); pointer-events: auto; width: 64px; height: 80px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; border: 3px solid rgba(255,255,255,.8);
    background: radial-gradient(circle at 35% 28%, #fffdf4, #f3e6c4 55%, #d6bf8a); color: #5a3a1e; font-family: inherit;
    font-size: 11px; font-weight: bold; cursor: pointer; line-height: 1.1; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  #btnPen b { display: block; font-size: 24px; }
  #btnPen:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  body.touch #btnPen { top: auto; bottom: calc(var(--hotC) + 60px - 4px); right: 104px; width: 56px; height: 70px; }
  .penList { display: grid; gap: 8px; margin: 12px 0; max-height: 52vh; overflow-y: auto; text-align: left; }
  .penRow { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.07); border-radius: 12px; padding: 8px 12px; }
  .penRow .pic { width: 52px; height: 52px; font-size: 36px; flex: none; }
  .penRow .pic img { width: 52px; height: 52px; }
  .penRow .inc { margin-left: auto; color: #ffd23f; font-weight: bold; white-space: nowrap; }
  #btnDrop { bottom: 64px; background: #e0753a; }

  /* ---------- 모바일 터치 조작 (터치 화면에서만 보임) ---------- */
  canvas { touch-action: none; }
  /* 게임 전체 화면 (휴대폰을 세로로 들면 통째로 90° 돌려서 항상 가로) */
  #app { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; transform-origin: 0 0; }
  /* 핫바 가운데 높이 (핫바 아래 12px + 안쪽 여백 4px + 칸 크기의 절반) — 휴대폰 조이스틱·점프 버튼의 가운데를 여기에 맞춤 */
  #app { --hotC: calc(16px + min(42px, calc(5.2 * var(--vw, 1vw))) / 2); }
  #touchUI { position: absolute; inset: 0; pointer-events: none; }
  #joy { position: absolute; left: 14px; bottom: calc(var(--hotC) - 77.5px); width: 155px; height: 155px; border-radius: 50%; pointer-events: auto; touch-action: none;
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; background: rgba(255,255,255,.6); pointer-events: none; }
  .tBtn { position: absolute; pointer-events: auto; touch-action: none; width: 78px; height: 78px; border-radius: 50%; border: 3px solid rgba(255,255,255,.7);
    background: rgba(0,0,0,.4); color: #fff; font-size: 28px; font-weight: bold; font-family: inherit; line-height: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; -webkit-user-select: none; }
  .tBtn small { font-size: 11px; margin-top: 3px; }
  .tBtn.on { background: rgba(255,204,51,.55); }
  #tJump { right: 14px; bottom: calc(var(--hotC) - 49px); width: 98px; height: 98px; font-size: 35px; }
  #tJump small { font-size: 13px; }
  #tAct { right: 124px; bottom: 74px; width: 70px; height: 70px; background: rgba(255,150,40,.45); }
  #tPause { left: 14px; bottom: calc(var(--hotC) + 90px); width: 46px; height: 46px; font-size: 18px; }
  body.touch #btnFly { top: auto; bottom: calc(var(--hotC) + 60px); right: 14px; width: 78px; height: 78px; transform: none; }
  body.touch #btnFly:active { transform: translateY(3px); }
  body.touch #btnDrop { right: 124px; bottom: 156px; }
  body.touch #prompt { font-size: 15px; bottom: 96px; max-width: calc(100% - 360px); white-space: normal; padding: 8px 12px; }
  body.touch #flyBar { bottom: 190px; }
  /* 휴대폰: 아래 양쪽 구석에 조이스틱·점프가 들어가게 핫바를 조금 작게 */
  body.touch .hotCell { width: min(42px, calc(5.2 * var(--vw, 1vw))); height: min(42px, calc(5.2 * var(--vw, 1vw))); }
  body.touch .hotCell .ico, body.touch #bagBtn { font-size: min(22px, calc(3.2 * var(--vw, 1vw))); }
  body.touch .hotCell .egg { width: 20px; height: 26px; }
  body.touch #hotName { bottom: 62px; }
    body.touch.short #hudL, body.touch.short #hudR { padding: 6px 10px; min-width: 0; }
    body.touch.short #hStage { font-size: 14px; } body.touch.short #hStatus, body.touch.short #hTime { font-size: 12px; }
    body.touch.short #hMoney { font-size: 18px; } body.touch.short #hIncome, body.touch.short #hFarm, body.touch.short #hFly, body.touch.short #hpWrap { font-size: 11px; }
    body.touch.short #hpBar { width: 80px; }
    body.touch.short #toast { font-size: 19px; }
  .shop { display: grid; gap: 10px; margin-top: 14px; text-align: left; }
  .shop .item { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(255,255,255,.07); border-radius: 12px; padding: 12px 14px; }
  .shop .item .btn { margin: 0; padding: 8px 16px; font-size: 15px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .wingIcon { display: inline-block; width: 34px; height: 22px; border-radius: 50% 50% 10% 50%; margin-right: 8px; vertical-align: middle; border: 1px solid #888; }

  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10,10,25,.72); backdrop-filter: blur(3px); }
  /* 내 우리·인벤토리·도감: 창을 띄운 채로 걸어다닐 수 있게 (화면을 가리지 않고 오른쪽에) */
  #overlay.walk { background: transparent; backdrop-filter: none; pointer-events: none; justify-content: flex-end; }
  #overlay.walk .panel { pointer-events: auto; max-width: 540px; margin-right: 16px; background: linear-gradient(160deg, rgba(43,47,74,.93), rgba(27,29,48,.93)); }
  .panel { background: linear-gradient(160deg, #2b2f4a, #1b1d30); border: 2px solid rgba(255,255,255,.15); border-radius: 22px; padding: 30px 38px; text-align: center; max-width: 760px; width: calc(100% - 32px); max-height: calc(92 * var(--vh, 1vh)); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .panel h1 { font-size: 42px; margin-bottom: 6px; }
  .panel h2 { font-size: 30px; margin-bottom: 10px; }
  .panel p { line-height: 1.6; color: #d8dcf0; }
  .rules { text-align: left; margin: 16px auto; background: rgba(255,255,255,.06); padding: 14px 18px; border-radius: 12px; font-size: 15px; line-height: 1.75; }
  .btn { display: inline-block; margin: 14px 6px 0; padding: 12px 28px; font-size: 18px; font-weight: bold; border: none; border-radius: 14px; cursor: pointer; background: #ffcc33; color: #3a2a00; box-shadow: 0 5px 0 #b8860b; font-family: inherit; }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8860b; }
  .netBox { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; align-items: center; margin-top: 10px; font-size: 15px; }
  #netStatus { width: 100%; color: #9dff9d; font-weight: bold; }
  #nameMsg { width: 100%; font-size: 13px; color: #9aa; min-height: 18px; }
  .netBox input { margin-left: 6px; padding: 8px 10px; font-size: 16px; border-radius: 10px; border: 2px solid rgba(255,255,255,.25); background: rgba(0,0,0,.3); color: #fff; font-family: inherit; width: 150px; }
  .btn.gray { background: #8d93b5; color: #1b1d30; box-shadow: 0 5px 0 #5a5f80; }

  .egg { width: 70px; height: 92px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; display: inline-block; position: relative; }
  .egg::after { content: ''; position: absolute; left: 22%; top: 14%; width: 22%; height: 18%; border-radius: 50%; background: rgba(255,255,255,.55); filter: blur(2px); }
  .egg.img { border-radius: 0; background-size: contain !important; background-position: center !important; background-repeat: no-repeat !important; }
  .egg.img::after { display: none; }
  .aimg { height: 1.25em; width: auto; vertical-align: middle; }
  .codex .pic .aimg { height: 58px; }
  .codex .pic .thumb { width: 72px; height: 72px; margin: -7px 0; }   /* 3D 모델 사진 */
  .aimg.card { border-radius: 8px; }                         /* 배경째 넣은 그림 (사진 카드처럼) */
  .egg.img.card { border-radius: 10px; background-size: cover !important; }
  .codex { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 14px; }
  .codex .cell { background: rgba(255,255,255,.06); border-radius: 12px; padding: 10px 4px; font-size: 12px; }
  .codex .cell .egg { width: 44px; height: 58px; }
  .codex .unknown { background: #444 !important; box-shadow: none !important; }
  .codex .unknown::after { display: none; }
  .codex .cell.click { cursor: pointer; transition: background .15s; } .codex .cell.click:hover { background: rgba(255,255,255,.14); }
  .codex .pic { height: 58px; display: flex; align-items: center; justify-content: center; font-size: 46px; line-height: 1; }
  /* 오른쪽 가운데 — 도감 열기 (Tab) */
  #btnCodex { position: absolute; right: 18px; top: 38%; transform: translateY(-50%); pointer-events: auto; width: 64px; height: 64px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.75); background: radial-gradient(circle at 35% 30%, #ffe08f, #c98a1c); color: #fff; font-family: inherit;
    font-size: 11px; font-weight: bold; cursor: pointer; line-height: 1.1; box-shadow: 0 4px 0 rgba(0,0,0,.35); text-shadow: 0 1px 2px #000; }
  #btnCodex b { display: block; font-size: 24px; }
  body.touch #btnCodex { top: 30%; right: 14px; width: 56px; height: 56px; }
  .row-label { grid-column: 1 / -1; text-align: left; font-weight: bold; margin-top: 6px; }
  body.narrow .panel { padding: 20px 16px; } body.narrow .panel h1 { font-size: 30px; } body.narrow .codex { grid-template-columns: repeat(3, 1fr); }
</style>

<body>
<div id="app">
<div id="hud" class="hidden">
  <div id="vignette"></div>
  <div id="hudL"><div id="hStage"></div><div id="hStatus"></div><div id="hTime"></div>
    <div id="bar"><div id="barFarm"></div><div id="barMe"></div><div id="barBoss" class="hidden"></div></div></div>
  <div id="hudR"><div id="hpWrap">HP <div id="hpBar"><div id="hpFill"></div></div><span id="hpText">100</span></div><div id="hMoney"></div><div id="hFly" style="font-size:13px"></div><div id="hIncome"></div><div id="hFarm"></div></div>
  <div id="jumpBanner" class="hidden">점프 하다</div>
  <div id="secretBanner" class="hidden"></div>
  <div id="toast"></div>
  <div id="prompt" class="hidden"></div>
  <div id="flyBar" class="hidden"></div>
  <button id="btnFly" class="hidden" onclick="tryFly();this.blur()" title="날기 (Shift + Space)"></button>
  <button id="btnPen" onclick="openPenInfo();this.blur()" title="내 우리 보기 (V)"><b>🥚</b>내 우리</button>
  <button id="btnCodex" onclick="openCodex();this.blur()" title="동물 도감 (Tab)"><b>📖</b>도감</button>
  <button id="btnDrop" class="hudBtn hidden" onclick="dropEgg()">🥚 달걀 내리기 (R)</button>
  <div id="hotName" class="hidden"></div>
  <div id="hotbar"></div>
  <div id="touchUI" class="hidden">
    <div id="joy"><div id="joyKnob"></div></div>
    <button id="tAct" class="tBtn">✋<small>E</small></button>
    <button id="tJump" class="tBtn">⤒<small>점프</small></button>
    <button id="tPause" class="tBtn">⏸</button>
  </div>
</div>
<div id="overlay"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<script>

  app.style.setProperty('--vw', VW / 100 + 'px'); app.style.setProperty('--vh', VH / 100 + 'px');
  document.body.classList.toggle('short', VH < 500);
  document.body.classList.toggle('narrow', VW < 600);
}
// 화면에서 손가락이 움직인 양 → 돌아간 게임 화면 기준 움직인 양

// =====================================================================
//  월드: [농장] ← 출발 → 1단계 오비 → 둥지 → 2단계 → 둥지 → 3단계 → 둥지
// =====================================================================
const world = new THREE.Group(); scene.add(world);
let colliders = [], movers = [], hazards = [], nests = [], profile = [], embers = null;
let mapEnd = 100, levelStarts = [], barrier = null, barrierC = null;
const shopPos = new THREE.Vector3(-6, 0, -6.5);
const sellPos = new THREE.Vector3(-6, 0, 6.5);

function setBounds(c) { c.minX = c.cx - c.hx; c.maxX = c.cx + c.hx; c.minZ = c.cz - c.hz; c.maxZ = c.cz + c.hz; }
function addCollider(cx, cz, hx, hz, minY, maxY, extra = {}) {
  const c = Object.assign({ cx, cz, hx, hz, minY, maxY, solid: true, dx: 0, dz: 0 }, extra);
  setBounds(c); colliders.push(c); return c;
}
function addPlatform(x, z, top, sx, sz, color, extra = {}) {
  const me = mesh(new THREE.BoxGeometry(sx, 0.6, sz), mat(color, { roughness: 0.55 }));
  me.position.set(x, top - 0.3, z); world.add(me);
  const c = addCollider(x, z, sx / 2, sz / 2, top - 0.6, top, extra);
  c.mesh = me;
  profile.push({ x0: x - sx / 2, x1: x + sx / 2, top });
  return c;
}

function buildWorld() {
  const rng = rngFn(4242);
  buildFarmScenery();

  let prevEnd = 0, prevW = MAP_HW * 2, y = 0, l = 0;
  LEVELS.forEach((L, li) => {
    const cfg = L.d, sf = 1 + li * 0.25, spinSize = 4.25;
    levelStarts.push(prevEnd);
    const sign = textSprite([
      { text: `${L.emoji} ${li + 1}단계`, font: 'bold 64px Malgun Gothic', color: '#fff', y: 80 },
      { text: BIOMES[li], font: 'bold 52px Malgun Gothic', color: '#ffe14a', y: 170 },
    ], 512, 256, 6);
    sign.position.set(prevEnd + 1.5, y + 4.5, -6); world.add(sign);

    for (let k = 1; k <= cfg.n; k++) {
      let type = 'static', size = cfg.size;
      const r = rng(); let acc = 0;
      if (k > 1) {
        if (r < (acc += cfg.mov)) type = 'move';
        else if (r < (acc += cfg.dis)) type = 'dis';
        else if (r < (acc += cfg.spin)) type = 'spin';
        else if (r < (acc += cfg.spike)) type = 'spike';
      }
      if (type === 'spin' || type === 'spike') size = spinSize;
      const gap = cfg.gap * (0.88 + rng() * 0.12);
      const x = prevEnd + gap + size / 2;
      // 대각선 거리가 점프 가능 범위(5.6)를 넘지 않게 옆 이동 제한
      const maxLat = prevW / 2 + size / 2 + Math.sqrt(Math.max(0, 5.6 * 5.6 - gap * gap)) * 0.9;
      const lim = MAP_HW - size / 2 - 0.4;
      let nl = l + (rng() * 2 - 1) * cfg.wig;
      nl = Math.max(l - maxLat, Math.min(l + maxLat, nl));
      if (type === 'move') nl = Math.max(-2, Math.min(2, nl));
      l = Math.max(-lim, Math.min(lim, nl));
      y = Math.max(0, Math.min(10, y + cfg.rise * (rng() * 1.4 - 0.4)));

      const color = type === 'move' ? new THREE.Color(L.color).offsetHSL(0, 0, 0.12).getHex() : L.color;
      const c = addPlatform(x, l, y, size, size, color);
      if (type === 'move') {
        const A = Math.min(2.6, MAP_HW - size / 2 - 0.4 - Math.abs(l));
        movers.push({ kind: 'move', c, bz: l, A, w: (1.1 + rng() * 0.9) * sf, ph: rng() * 6.28 });
      } else if (type === 'dis') {
        c.mesh.material.transparent = true; c.mesh.material.color.set(0xb8f0ff);
        movers.push({ kind: 'dis', c, T: 3.0 / sf, ph: rng() * 3 });
      } else if (type === 'spin') {
        const gr = new THREE.Group(), len = size * 0.98;
        const bar = mesh(new THREE.BoxGeometry(len, 0.35, 0.35), mat(0xff2a2a, { emissive: 0x550000 }));
        const post = mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.8, 8), mat(0x444444)); post.position.y = -0.3;
        gr.add(bar, post); gr.position.set(x, y + 0.6, l); world.add(gr);
        const sp = { kind: 'spin', g: gr, cx: x, cz: l, y0: y + 0.6, len, angle: rng() * 6, w: (2.0 + rng() * 1.0) * sf * (rng() < 0.5 ? 1 : -1) };
        movers.push(sp); hazards.push(sp);
      } else if (type === 'spike') {
        const sk = mesh(new THREE.BoxGeometry(1.2, 1.1, 1.2), mat(0xff2a2a, { emissive: 0x660000 }));
        sk.position.set(x, y + 0.55, l); world.add(sk);
        hazards.push({ kind: 'spike', minX: x - 0.55, maxX: x + 0.55, minZ: l - 0.55, maxZ: l + 0.55, minY: y, maxY: y + 1.05 });
      }
      prevEnd = x + size / 2; prevW = size;
    }

    // 달걀 훔치는 둥지 (2배 크기): 달걀 5개 + 잠자는 보스
    const NL = 24;
    const nx = prevEnd + cfg.gap * 0.8 + NL / 2;
    y = Math.max(0, Math.min(10, y + 0.3)); l = 0;
    addPlatform(nx, 0, y, NL, MAP_HW * 2, L.nest);
    // 보스는 둥지의 왼쪽(-z)에서 오른쪽(+z)을 보고 자고, 달걀 5개는 보스 앞에 곡선(호) 모양으로 놓임
    const bossZ = -MAP_HW + 1.5 + Math.min(2, L.bossH * 0.25);
    const R = 3 + L.bossH * 0.5;
    const spots = [];
    for (let i = 0; i < 5; i++) {
      const a = (-50 + i * 25) * Math.PI / 180;
      const p = new THREE.Vector3(nx + Math.sin(a) * R, y, bossZ + Math.cos(a) * R);
      const ring = mesh(new THREE.TorusGeometry(0.45, 0.16, 8, 18), mat(0xc49a4a)); ring.rotation.x = Math.PI / 2;
      ring.position.set(p.x, y + 0.1, p.z); world.add(ring);
      spots.push(p);
    }
    const boss = makeAnimal(L.bossType, L.bossH);
    const sleepPos = new THREE.Vector3(nx, y - L.sink, bossZ), sleepRot = 0;
    boss.g.position.copy(sleepPos); boss.g.rotation.y = sleepRot;
    world.add(boss.g);
    const zzz = textSprite([{ text: 'Zzz', font: 'bold 90px Arial', color: '#bfe0ff', y: 64 }], 256, 128, Math.max(1.4, L.bossH * 0.5), false);
    world.add(zzz);
    const n = { lv: li, x: nx, top: y, eggs: [], spots, group: new THREE.Group(), boss, zzz, sleepPos, sleepRot };
    world.add(n.group);
    nests.push(n);
    prevEnd = nx + NL / 2; prevW = MAP_HW * 2;
  });
  mapEnd = prevEnd;

  // 직사각형 경계 (투명 벽)
  // 오비 구간(x ≥ 0)은 좁게(±MAP_HW), 농장(x < 0)은 우리 5개가 들어가게 넓게(±FARM_HW)
  const len = mapEnd, midX = mapEnd / 2;
  const wallMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.06, side: THREE.DoubleSide, depthWrite: false });
  [-1, 1].forEach(sd => {
    const w = new THREE.Mesh(new THREE.PlaneGeometry(len, 50), wallMat); w.position.set(midX, 12, sd * MAP_HW); world.add(w);
    addCollider(midX, sd * (MAP_HW + 0.5), len / 2, 0.5, -100, 100);
    for (let x = 0; x <= mapEnd; x += 12) {
      const p = mesh(new THREE.CylinderGeometry(0.15, 0.15, 50, 6), mat(0xffffff, { emissive: 0xffffff, emissiveIntensity: 0.2 }), false);
      p.position.set(x, 12, sd * MAP_HW); world.add(p);
    }
    const fw = new THREE.Mesh(new THREE.PlaneGeometry(-FARM_X0, 50), wallMat); fw.position.set(FARM_X0 / 2, 12, sd * FARM_HW); world.add(fw);
    addCollider(FARM_X0 / 2, sd * (FARM_HW + 0.5), -FARM_X0 / 2, 0.5, -100, 100);
    // 농장 앞쪽 가장자리 (오비 입구 양옆 막기)
    const sw = (FARM_HW - MAP_HW) / 2, sz = sd * (MAP_HW + sw);
    const ew = new THREE.Mesh(new THREE.PlaneGeometry(sw * 2, 50), wallMat); ew.rotation.y = Math.PI / 2; ew.position.set(0, 12, sz); world.add(ew);
    addCollider(0.5, sz, 0.5, sw, -100, 100);
  });
  addCollider(FARM_X0 - 0.5, 0, 0.5, FARM_HW, -100, 100);
  addCollider(mapEnd + 0.5, 0, 0.5, MAP_HW, -100, 100);
  [[FARM_X0, FARM_HW], [mapEnd, MAP_HW]].forEach(([x, hw]) => { const w = new THREE.Mesh(new THREE.PlaneGeometry(hw * 2, 50), wallMat); w.rotation.y = Math.PI / 2; w.position.set(x, 12, 0); world.add(w); });

  // 밤에 생기는 방벽 (농장 → 오비 입장 막기)
  barrier = new THREE.Mesh(new THREE.BoxGeometry(0.4, 14, MAP_HW * 2),
    new THREE.MeshStandardMaterial({ color: 0x8a5cff, emissive: 0x6a3cff, emissiveIntensity: 1, transparent: true, opacity: 0.55 }));
  barrier.position.set(0.2, 6, 0); barrier.visible = false; world.add(barrier);
  barrierC = addCollider(0.2, 0, 0.2, MAP_HW, -5, 14, { solid: false });

  profile.sort((a, b) => a.x0 - b.x0);
  buildScenery(rng);
}

function buildFarmScenery() {
  addPlatform(FARM_X0 / 2, 0, 0, -FARM_X0, FARM_HW * 2, 0x72c14f, { farm: true });
  const dirt = mesh(new THREE.BoxGeometry(-FARM_X0, 6, FARM_HW * 2), mat(0x8a5a33), false); dirt.position.set(FARM_X0 / 2, -3.6, 0); world.add(dirt);
  // 헛간
  const barn = new THREE.Group();
  const wall = mesh(new THREE.BoxGeometry(4, 4.5, 9), mat(0xc0392b)); wall.position.y = 2.25; barn.add(wall);
  const roof = mesh(new THREE.ConeGeometry(5.6, 2.6, 4), mat(0x5b3a29)); roof.position.y = 5.8; roof.rotation.y = Math.PI / 4; roof.scale.set(0.6, 1, 1.25); barn.add(roof);
  const door = mesh(new THREE.BoxGeometry(0.1, 2.6, 2.4), mat(0xf5e6c8)); door.position.set(2.05, 1.3, 0); barn.add(door);
  barn.position.set(FARM_X0 + 2.5, 0, 0); world.add(barn);
  addCollider(FARM_X0 + 2.5, 0, 2, 4.5, 0, 4.5);
  const fs = textSprite([{ text: '🏡 내 농장', font: 'bold 80px Malgun Gothic', color: '#fff', y: 128 }], 512, 256, 6);
  fs.position.set(FARM_X0 + 5, 8.5, 0); world.add(fs);
  // 정사각형 울타리 우리 (앞쪽 가운데에 입구)
  const wood = mat(0xd9b38c);
  const fence = (ax, az, bx, bz) => {          // 축에 평행한 울타리 한 줄
    const len = Math.hypot(bx - ax, bz - az), alongX = az === bz;
    const n = Math.max(1, Math.round(len / 1.5));
    for (let i = 0; i <= n; i++) {
      const p = mesh(new THREE.BoxGeometry(0.2, 1.2, 0.2), wood);
      p.position.set(ax + (bx - ax) * i / n, 0.6, az + (bz - az) * i / n); world.add(p);
    }
    [0.45, 0.95].forEach(h => {
      const r = mesh(new THREE.BoxGeometry(alongX ? len : 0.1, 0.12, alongX ? 0.1 : len), wood);
      r.position.set((ax + bx) / 2, h, (az + bz) / 2); world.add(r);
    });
    addCollider((ax + bx) / 2, (az + bz) / 2, alongX ? len / 2 : 0.12, alongX ? 0.12 : len / 2, 0, 1.2);
  };
  for (let k = 0; k < PEN_N; k++) {
    const z0 = penZ(k);
    const hay = mesh(new THREE.BoxGeometry(PEN.x1 - PEN.x0, 0.04, PEN.z * 2), mat(0xd9c27a), false);
    hay.position.set((PEN.x0 + PEN.x1) / 2, 0.02, z0); world.add(hay);
    fence(PEN.x0, z0 - PEN.z, PEN.x0, z0 + PEN.z);           // 뒤
    fence(PEN.x0, z0 - PEN.z, PEN.x1, z0 - PEN.z);           // 왼쪽
    fence(PEN.x0, z0 + PEN.z, PEN.x1, z0 + PEN.z);           // 오른쪽
    fence(PEN.x1, z0 - PEN.z, PEN.x1, z0 - 2);               // 앞 (입구 양옆)
    fence(PEN.x1, z0 + 2, PEN.x1, z0 + PEN.z);
    // 우리 번호 깃발 (플레이어 색)
    const flag = mesh(new THREE.BoxGeometry(0.1, 0.7, 1.1), mat(PEN_COLORS[k])); flag.position.set(PEN.x1 + 0.1, 1.75, z0 + 2.6); world.add(flag);
    const pole = mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.2, 6), wood); pole.position.set(PEN.x1, 1.1, z0 + 2.1); world.add(pole);
    const ps = liveLabel(5); ps.position.set(PEN.x1 + 0.5, 3.2, z0); world.add(ps);
    penSigns.push(ps);
  }
  drawPenSigns();
  // 날개 상점
  const shop = new THREE.Group();
  const counter = mesh(new THREE.BoxGeometry(3, 1.1, 1.4), mat(0x8e5a2b)); counter.position.y = 0.55; shop.add(counter);
  [[-1.4, -0.6], [1.4, -0.6], [-1.4, 0.6], [1.4, 0.6]].forEach(([x, z]) => { const p = mesh(new THREE.CylinderGeometry(0.07, 0.07, 2.8, 6), wood); p.position.set(x, 1.4, z); shop.add(p); });
  const awn = mesh(new THREE.BoxGeometry(3.4, 0.2, 1.8), mat(0x5ab0ff)); awn.position.y = 2.85; shop.add(awn);
  shop.position.copy(shopPos); world.add(shop);
  addCollider(shopPos.x, shopPos.z, 1.5, 0.7, 0, 1.1);
  const ss = textSprite([{ text: '🪽 날개 상점 (E)', font: 'bold 64px Malgun Gothic', color: '#ffe14a', y: 128 }], 512, 256, 4);
  ss.position.set(shopPos.x, 4.3, shopPos.z); world.add(ss);
  // 판매 상점 (날개 상점 반대편)
  const sell = new THREE.Group();
  const counter2 = mesh(new THREE.BoxGeometry(3, 1.1, 1.4), mat(0x8e5a2b)); counter2.position.y = 0.55; sell.add(counter2);
  [[-1.4, -0.6], [1.4, -0.6], [-1.4, 0.6], [1.4, 0.6]].forEach(([x, z]) => { const p = mesh(new THREE.CylinderGeometry(0.07, 0.07, 2.8, 6), wood); p.position.set(x, 1.4, z); sell.add(p); });
  const awn2 = mesh(new THREE.BoxGeometry(3.4, 0.2, 1.8), mat(0x3ccf4e)); awn2.position.y = 2.85; sell.add(awn2);
  const coin = mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.1, 20), mat(0xffd23f, { metalness: 0.8, roughness: 0.3, emissive: 0x553300 }));
  coin.rotation.x = Math.PI / 2; coin.position.set(0, 1.5, 0); sell.add(coin);
  sell.position.copy(sellPos); world.add(sell);
  addCollider(sellPos.x, sellPos.z, 1.5, 0.7, 0, 1.1);
  const ss2 = textSprite([{ text: '💰 판매 상점 (E)', font: 'bold 64px Malgun Gothic', color: '#9dff9d', y: 128 }], 512, 256, 4);
  ss2.position.set(sellPos.x, 4.3, sellPos.z); world.add(ss2);
}

function buildScenery(rng) {
  // 3단계(공룡 지역) 아래는 용암
  const lx0 = levelStarts[2] - 10, lw = mapEnd - lx0 + 200;
  const lava = new THREE.Mesh(new THREE.PlaneGeometry(lw, 500), new THREE.MeshStandardMaterial({ color: 0xff4400, emissive: 0xff3300, emissiveIntensity: 0.9, roughness: 1 }));
  lava.rotation.x = -Math.PI / 2; lava.position.set(lx0 + lw / 2, -14, 0); world.add(lava);
  for (let i = 0; i < 6; i++) {
    const x = levelStarts[2] + rng() * (mapEnd - levelStarts[2]), z = (rng() < 0.5 ? -1 : 1) * (90 + rng() * 60);
    const v = mesh(new THREE.ConeGeometry(25 + rng() * 15, 60 + rng() * 40, 12), mat(0x2b1d18, { flatShading: true }), false);
    v.position.set(x, 15, z); world.add(v);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(6, 10, 8), new THREE.MeshBasicMaterial({ color: 0xff6a00 }));
    tip.position.set(x, 15 + v.geometry.parameters.height / 2 - 3, z); world.add(tip);
  }
  const n = 400, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { pos[i * 3] = levelStarts[2] + rng() * (mapEnd - levelStarts[2]); pos[i * 3 + 1] = rng() * 40 - 12; pos[i * 3 + 2] = (rng() - 0.5) * 80; }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  embers = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffaa33, size: 0.35, transparent: true, opacity: 0.85 }));
  world.add(embers);
  // 초원·정글: 구름 + 떠 있는 섬
  const cm = mat(0xffffff, { roughness: 1 });
  for (let i = 0; i < 40; i++) {
    const x = FARM_X0 - 30 + rng() * (levelStarts[2] - FARM_X0 + 30), z = (rng() < 0.5 ? -1 : 1) * (25 + rng() * 120), yy = -40 + rng() * 70;
    const g = new THREE.Group();
    for (let k = 0; k < 4; k++) { const c = new THREE.Mesh(new THREE.SphereGeometry(3 + rng() * 3, 10, 8), cm); c.position.set(k * 3.5 - 5, rng() * 1.5, rng() * 2); g.add(c); }
    g.position.set(x, yy, z); world.add(g);
  }
  for (let x = 10; x < levelStarts[2]; x += 35) {
    const jungle = x >= levelStarts[1];
    [-1, 1].forEach(sd => {
      const z = sd * (22 + rng() * 10), yy = -6 + rng() * 6;
      const isl = mesh(new THREE.ConeGeometry(5, 7, 8), mat(jungle ? 0x5d4128 : 0x8a5a33), false); isl.rotation.x = Math.PI; isl.position.set(x, yy - 3.5, z); world.add(isl);
      const top = mesh(new THREE.CylinderGeometry(5, 5, 0.6, 8), mat(jungle ? 0x3f8a3a : 0x72c14f), false); top.position.set(x, yy, z); world.add(top);
      if (!jungle) { const hay = mesh(new THREE.BoxGeometry(2.4, 1.6, 1.6), mat(0xe8c65a)); hay.position.set(x, yy + 1.1, z); world.add(hay); }
      else {
        const trunk = mesh(new THREE.CylinderGeometry(0.4, 0.5, 5, 8), mat(0x6b4a2b)); trunk.position.set(x, yy + 2.8, z); world.add(trunk);
        const leaf = mesh(new THREE.SphereGeometry(2.3, 10, 8), mat(0x2f7d32)); leaf.position.set(x, yy + 6, z); world.add(leaf);
      }
    });
  }
}

// 둥지의 달걀 5개를 확률에 따라 새로 스폰 (등급은 표시 안 함, 시크릿만 빛나는 아우라)
function rollNest(n) {

// 보스가 오비 위를 따라 달릴 때의 높이 (빈틈에서는 점프)
function groundAt(x) {
  let prev = null;
  for (const p of profile) {
    if (x >= p.x0 && x <= p.x1) return p.top;
    if (p.x1 < x) { if (!prev || p.x1 > prev.x1) prev = p; }
    else if (p.x0 > x) {
      if (!prev) return p.top;
      const t = (x - prev.x1) / (p.x0 - prev.x1);
      return prev.top + (p.top - prev.top) * t + Math.sin(t * Math.PI) * 2;
    }
  }
  return prev ? prev.top : 0;
}

    else P.vel.y = Math.max(P.vel.y - G * h, -45);
    P.pos.x += P.vel.x * h; resolveH('x');
    P.pos.z += P.vel.z * h; resolveH('z');
    const prevY = P.pos.y; P.pos.y += P.vel.y * h;
    P.onGround = false;
    let ground = null;
    for (const c of colliders) {
      if (!c.solid || !overlapP(c)) continue;
      if (P.vel.y <= 0 && prevY >= c.maxY - 0.3) { P.pos.y = c.maxY; P.vel.y = 0; P.onGround = true; ground = c; }
      else if (P.vel.y > 0 && prevY + PH <= c.minY + 0.3) { P.pos.y = c.minY - PH; P.vel.y = 0; }
    }
    P.ground = ground;
  }
  if (P.onGround) { P.canFly = true; P.dj = true; P.safePos.copy(P.pos); }   // 땅에 닿으면 다시 날 수 있음 / 더블점프 충전
  if (P.djT > 0) { P.djT -= dt; if (P.djT <= 0 && !(P.flying > 0)) showWingModel(playerModel, 0); }

  // 위험물: 회전 막대 HP -30, 가시 블록 HP -70 (HP 0이 되면 농장으로) / 낙하 → 농장으로
  P.hurtT -= dt;
  if (P.pos.x < 0) { P.hp = MAX_HP; P.life = true; }   // 농장에 오면 HP 회복 · 추가 생명 충전
  if (P.hurtT <= 0 && !(P.shield > 0)) for (const hz of hazards) {   // 다이아 무적 중에는 함정 무시
    if (hz.kind === 'spike') {
      if (P.pos.x + HW > hz.minX && P.pos.x - HW < hz.maxX && P.pos.z + HW > hz.minZ && P.pos.z - HW < hz.maxZ && P.pos.y < hz.maxY && P.pos.y + PH > hz.minY) {
        if (hurt(70, '앗! 가시 블록!', P.pos.x - (hz.minX + hz.maxX) / 2, P.pos.z - (hz.minZ + hz.maxZ) / 2)) return;
        break;
      }
    } else {
      const dx = P.pos.x - hz.cx, dz = P.pos.z - hz.cz, ca = Math.cos(hz.angle), sa = Math.sin(hz.angle);
      const lx = dx * ca - dz * sa, lz = dx * sa + dz * ca;
      if (Math.abs(lx) < hz.len / 2 + HW && Math.abs(lz) < 0.18 + HW && P.pos.y < hz.y0 + 0.18 && P.pos.y + PH > hz.y0 - 0.18) {
        if (hurt(30, '으악! 회전 막대!', dx, dz)) return;
        break;
      }
    }
  }
  if (P.pos.y < -12) return revive(true) || fail(P.pos.x > levelStarts[2] ? '앗 뜨거! 용암에 빠졌다!' : '으아아 떨어졌다!');

  if (P.held && inPen()) securePenEgg();   // 훔친 달걀을 들고 내 우리에 들어오면 안전
  // 달걀 가까이 가면 흰색 윤곽선
  const ne = nearEgg();
  const holdPick = keys.KeyE || mouseHeld || touchHeld;
  if (!P.pick && holdPick && ne && !(P.flying > 0)) {   // 날개로 나는 중에는 못 듦
    if (SAVE.inv.length >= INV_MAX) { if (!P.invFullT || T - P.invFullT > 2) { P.invFullT = T; toast('🎒 인벤토리가 가득 차서 달걀을 훔칠 수 없어요 (100칸)', 1.8); } }
    else P.pick = { n: ne.n, e: ne.e, t: 0, tick: 0 };
  }
  const target = P.pick ? P.pick.e : ne ? ne.e : null;
  if (outlined !== target) { if (outlined) outlined.outline.visible = false; if (target) target.outline.visible = true; outlined = target; }

  // 달걀 들기 (3초 동안 꾹 누르기)
  let pr = '';
  if (P.pick) {
    const pk = P.pick, d = Math.hypot(P.pos.x - pk.e.pos.x, P.pos.z - pk.e.pos.z);
    if (pk.e.taken || d > 2.2) { P.pick = null; toast('달걀 들기 취소', 1); }
    else if (!holdPick) { P.pick = null; toast('✋ 손을 떼서 취소됐어요\n3초 동안 꾹 누르고 있어야 해요', 1.6); }
    else {
      pk.t += dt; pk.tick -= dt;
      if (pk.tick <= 0) { sfx('tick'); pk.tick = 0.5; }
      pr = `${eggLabel(pk.n.lv, pk.e.g)} 훔치는 중... ${Math.max(0, 3 - pk.t).toFixed(1)}초<div class="pbar"><div style="width:${Math.min(100, pk.t / 3 * 100)}%"></div></div>`;
      if (pk.t >= 3) { takeEgg(pk.n, pk.e); P.pick = null; pr = ''; }
    }
  } else if (nearShop()) {
    pr = '<b>E</b> — 🪽 날개 상점 열기';
  } else if (nearSellShop()) {
    pr = '<b>E</b> — 💰 판매 상점 열기 (펫·알 팔기)';
  } else if (nearUpSign() && !P.held) {
    const lv = penLv();
    pr = lv >= PEN_UP.length ? '🏡 우리가 최고 레벨이에요 (동물 ' + penCap() + '마리)'
      : `<b>E</b> 또는 표지판 버튼 클릭 — 🏡 우리 업그레이드 <b style="color:${SAVE.money >= PEN_UP[lv] ? '#5f5' : '#f66'}">$${fmt(PEN_UP[lv])}</b> (동물 ${penCap()} → ${penCap() + PEN_STEP_CAP}마리)`;
  } else if (P.held && inPen()) {
    const es = nearEmptySlot();
    if (es) pr = `<b>E</b> — 🥚 여기에 달걀 놓기`;
    else if (penFull()) pr = `우리가 가득 찼어요 — <b>E</b>: 달걀 팔기 (+$${fmt(animalOf(P.held.lv, P.held.g).inc * 60)})`;
    else pr = '🐣 원하는 <b>빈 칸</b>(바닥의 노란 동그라미) 위로 가서 <b>E</b>를 눌러 심어요';
  } else if (penChoice()) {
    const c = penChoice();
    if (c.place !== undefined) pr = `<b>E</b> — 핫바 ${hotSel + 1}번 ${itemName(SAVE.inv[hotSel])}을(를) 여기에 놓기`;
    else { const { v } = c.pick; pr = `<b>E</b> — ${v.kind === 'baby' ? `${EMOJI[v.a.type]} ${v.a.name}` : '🥚 부화 중인 알'} 들기 (🎒 인벤토리로)`; }
  } else if (P.held && inOtherPen()) {
    pr = '🚫 다른 사람의 우리예요 — <b>내 우리</b>(노란 간판)로 가세요';
  } else if (ne && P.flying > 0) {
    pr = '🪽 날개로 나는 중에는 달걀을 들 수 없어요';
  } else if (ne) {
    pr = `<b>E</b> 또는 <b>클릭</b>을 <b>3초 꾹</b> — ${eggLabel(ne.n.lv, ne.e.g)} 들기 <span style="color:#ff8080">⚠ ${LEVELS[ne.n.lv].boss}가 깨어나요!</span>`;
  } else if (P.held && P.pos.x < 0 && !inPen()) {
    pr = '🏃 울타리 우리 안으로 들어가면 훔친 달걀이 진짜 내 것이 돼요!';
  }
  $('prompt').classList.toggle('hidden', !pr);
  if (pr) $('prompt').innerHTML = pr;

  // 우리 안: 심을 칸 노랗게 표시 (달걀을 들었거나 핫바에 아이템이 있을 때)
  const hc = P.held ? nearEmptySlot() : penChoice();
  highlightSlot(P.held ? (hc ? hc.i : -1) : (hc && hc.place !== undefined ? hc.place : -1));
  P.invuln -= dt;

  // 모델 애니메이션
  const hs = Math.hypot(P.vel.x, P.vel.z);
  if (hs > 0.5) {
    const want = Math.atan2(P.vel.x, P.vel.z); let diff = want - P.face; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    P.face += diff * Math.min(1, dt * 12);
  }
  P.anim += dt * hs * 1.6;
  const pm = playerModel, sw = P.onGround ? Math.sin(P.anim) * Math.min(1, hs / 6) * 0.9 : 0.5;
  pm.legs[0].rotation.x = sw; pm.legs[1].rotation.x = -sw;
  const up = P.pick || playerModel.hotG.visible;
  pm.arms[0].rotation.x = up ? Math.PI : -sw; pm.arms[1].rotation.x = up ? Math.PI : sw;
  pm.g.position.copy(P.pos); pm.g.rotation.y = P.face;
  pm.betaTag.position.y = up ? 2.75 : 2.2;
  if (myTag) myTag.position.set(P.pos.x, P.pos.y + tagY(pm, up), P.pos.z);
  pm.g.visible = !((P.invuln > 0 || P.hurtT > 0) && Math.sin(T * 30) > 0);
  // 다이아 무적: 반짝이는 보호막 (끝나기 1초 전부터 깜빡깜빡)
  shieldBall.visible = P.shield > 0 && (P.shield > 1 || Math.sin(T * 25) > 0);
  if (shieldBall.visible) { shieldBall.position.set(P.pos.x, P.pos.y + 0.9, P.pos.z); shieldBall.material.opacity = 0.2 + Math.sin(T * 8) * 0.08; }
  // 날개는 장착하면 항상 보임 (평소엔 살랑살랑, 비행·더블점프 중엔 힘차게)
  const cw = curWing(), wingOn = P.flying > 0 || P.djT > 0;
  showWingModel(pm, cw ? cw.color : 0);
  flapWings(pm, T, wingOn);
}

// 실패 (떨어짐 / 함정 / 잡힘) → 달걀 없이 농장으로
function goFarm() {
  loseHeld();
  P.pick = null; sleepBoss(); stopFly(); P.dashT = 0; P.shield = 0; P.hp = MAX_HP; P.hurtT = 0;
  P.pos.copy(farmSpawn()); P.vel.set(0, 0, 0); P.ground = null; P.invuln = 1;
  camYaw = -Math.PI / 2;
}
// 함정에 맞음: HP만 줄고 그대로 통과 (1초 무적). HP 0이면 농장으로 → true 반환
function hurt(dmg, msg) {
  const cw = curWing();
  if (cw && cw.inf) return false;   // 제작자 날개: 무제한 체력 (함정에 안 다침)
  P.hp = Math.max(0, P.hp - dmg);
  if (P.hp <= 0) { if (!revive(false)) fail(`${msg} HP 0!`); return true; }
  P.hurtT = 1.0; shake = 0.25; sfx('die');
  toast(`${msg} -${dmg} HP`, 1.2);
  return false;
}
// 다이아 날개 추가 생명: 떨어지면 마지막으로 밟은 땅, HP 0이면 그 자리에서 부활 (달걀은 그대로 들고 있음)
function revive(fell) {
  const w = curWing(); if (!w) return false;
  const inf = !!w.inf;   // 제작자 날개: 무한 부활
  if (!inf && (!w.life || !P.life)) return false;
  if (!inf) P.life = false;
  if (fell) P.pos.copy(P.safePos);
  P.vel.set(0, 0, 0); P.ground = null; P.dashT = 0; stopFly();
  P.hp = MAX_HP; P.hurtT = 0; P.shield = Math.max(P.shield, 2);   // 부활 직후 2초 무적
  sfx('fly'); shake = 0.3;
  toast(inf ? '✨ 제작자 날개의 힘으로 그 자리에서 부활!' : '💎 추가 생명 사용! 그 자리에서 부활했어요\n(농장에 돌아가면 다시 충전돼요)', inf ? 1.5 : 2.5);
  return true;
}
function fail(msg) {
  const had = loseHeld();
  if (had) returnToNest(had.e);   // 잃은 달걀은 인벤토리에서 빠지고 원래 둥지로
  sfx('die'); shake = 0.4; goFarm();
  toast(had ? `${msg}\n달걀은 원래 자리로 돌아갔어요` : `${msg}\n농장으로 돌아왔어요`, 2.2);
}
function caught() {
  if (revive(false)) return;   // 다이아 날개 추가 생명: 잡혀도 그 자리에서 부활 (달걀 그대로)
  const L = B.L;
  const y = P.onGround ? P.pos.y : groundAt(P.pos.x);
  const r = releaseEgg(P.pos.x, y, P.pos.z);
  sfx('caught'); shake = 0.6; goFarm();
  toast(`${L.emoji} ${L.boss}에게 잡혔다!\n${r === 'nest' ? '달걀은 원래 자리로 돌아갔어요' : '달걀은 잡힌 자리에 떨어졌어요'}`, 2.8);
}

function takeEgg(n, e) {
  hideEgg(e);
  let origin = e;
  if (e.ground) {   // 바닥에 내려놨던 달걀을 다시 주움
    origin = e.origin;
    removeGroundEgg(e);
    NET.send({ t: 'gtake', c: lastCycle, gid: e.id });
  } else NET.send({ t: 'take', c: lastCycle, lv: n.lv, i: e.idx });
  // 훔친 달걀은 바로 인벤토리로 (stolen: 아직 우리까지 못 가져간 달걀 — 잡히거나 떨어지면 인벤토리에서 사라짐)
  const item = { kind: 'egg', lv: n.lv, g: e.g, prog: 0, stolen: true };
  SAVE.inv.push(item);
  P.held = { lv: n.lv, g: e.g, n, e: origin, item };
  stopFly();   // 달걀을 훔쳐 오는 중에는 날 수 없음
  sfx('pick');
  toast(`🎒 ${eggLabel(n.lv, e.g)}이(가) 인벤토리에 들어왔다!\n😱 ${LEVELS[n.lv].boss}가 깨어난다...! 우리까지 도망쳐!`, 2.4);
  camYaw = Math.PI / 2;   // 농장 쪽을 바라보게
  wakeBoss(n);
}

// 고른 칸(idx)에 들고 온 달걀 심기. idx = -1 이면 우리가 가득 차서 팔기
function depositEgg(idx) {
  const { lv, g } = P.held, a = animalOf(lv, g);
  if (idx >= 0 && !SAVE.slots[idx]) {
    SAVE.slots[idx] = newSlot(lv, g, 0);
    toast(`🏡 ${eggLabel(lv, g)}을(를) 우리에 놓았다!\n무엇이 태어날까?`, 2.4);
  } else {
    const price = a.inc * 60;
    SAVE.money += price;
    toast(`농장이 가득 차서 달걀을 팔았다! +${fmt(price)} 💰`, 2.8);
  }
  if (!SAVE.codex.includes(lv + '-' + g)) SAVE.codex.push(lv + '-' + g);
  sfx('clear');
  P.held = null; playerModel.holder.clear();
  sleepBoss();
  save(); rebuildFarm();
}

// 도감: 처음엔 부화한 모습(동물)으로, 칸을 클릭하면 달걀 모습 ↔ 동물 모습으로 바뀜
const codexEgg = new Set();   // 달걀 모습으로 뒤집어 둔 칸 ('lv-g')
let codexInGame = false;
function openCodex() { if (state !== 'play') return; state = 'codex'; unlock(); codexInGame = true; codexScreen(); }
function flipCodex(k) { codexEgg.has(k) ? codexEgg.delete(k) : codexEgg.add(k); codexScreen(); }
// 도감 사진: 게임 속 3D 모델을 작은 그림으로 찍어 둠 (한 번 찍으면 저장해 두고 다시 씀)
let _thumbR = null;
const _thumbs = {};
function modelThumb(key, build) {
  if (key in _thumbs) return _thumbs[key];
  let url = null;
  try {
    if (!_thumbR) {
      _thumbR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      _thumbR.setSize(160, 160); _thumbR.setClearColor(0x000000, 0);
      ['outputEncoding', 'toneMapping', 'toneMappingExposure', 'physicallyCorrectLights'].forEach(p => { if (p in renderer) _thumbR[p] = renderer[p]; });
    }
    const sc = new THREE.Scene();
    sc.add(new THREE.HemisphereLight(0xffffff, 0x556644, 1.0));
    const dl = new THREE.DirectionalLight(0xffffff, 1.1); dl.position.set(3, 6, 5); sc.add(dl);
    const obj = build(); sc.add(obj);
    const bs = new THREE.Box3().setFromObject(obj).getBoundingSphere(new THREE.Sphere());
    const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 200);
    const dir = new THREE.Vector3(0.75, 0.38, 1).normalize();   // 앞쪽 비스듬히 위에서
    cam.position.copy(bs.center).addScaledVector(dir, bs.radius / Math.sin(15 * Math.PI / 180) * 1.02);
    cam.lookAt(bs.center);
    _thumbR.render(sc, cam);
    url = _thumbR.domElement.toDataURL('image/png');
  } catch (e) { url = null; }
  return (_thumbs[key] = url);
}
const animalThumb = (lv, g) => modelThumb('a' + lv + '-' + g, () => makeAnimal(animalOf(lv, g).type, 1.6).g);
const eggThumb = (lv, g) => modelThumb('e' + lv + '-' + g, () => makeEggMesh(lv, g));
// 도감 칸 그림: 동물은 3D 모델 사진, 알은 받은 그림이 있으면 그 그림, 없으면 3D 알 사진
function codexAnimalPic(lv, g) {
  const u = animalThumb(lv, g);
  return `<div class="pic">${u ? `<img class="thumb" src="${u}" alt="">` : animalIcon(animalOf(lv, g).type)}</div>`;
}
function codexEggPic(lv, g) {
  if (EGG_IMG[lv + '-' + g]) return eggHTML(lv, g);
  const u = eggThumb(lv, g);
  return u ? `<div class="pic"><img class="thumb" src="${u}" alt=""></div>` : eggHTML(lv, g);
}
function codexScreen() {
  if (state !== 'codex') codexInGame = false;   // 타이틀 화면에서 연 도감
  let cells = '', total = 0;
  ANIMALS.forEach((row, lv) => {
    cells += `<div class="row-label">${LEVELS[lv].emoji} ${LEVELS[lv].name}</div>`;
    row.forEach((a, g) => {
      total++;

function placeInvAt(i, idx) {
  const it = SAVE.inv[i]; if (!it || SAVE.slots[idx]) return;
  if (it.stolen) {   // 훔쳐 오는 중인 달걀은 우리까지 직접 가져가야 함
    const msg = '🏃 훔쳐 오는 중인 달걀이에요\n울타리 우리 안까지 가져가야 놓을 수 있어요';
    if (state === 'play') toast(msg, 2.2); else { invSel = i; invMsg = msg.replace('\n', ' · '); }
    return false;

  if (it.kind === 'pet' && animalCount() >= penCap()) {   // 동물은 우리 레벨만큼만 놓을 수 있음 (알은 제한 없음)
    const msg = `🚫 동물은 ${penCap()}마리까지만 놓을 수 있어요\n우리 앞 표지판에서 업그레이드하면 +${PEN_STEP_CAP}마리!`;
    if (state === 'play') toast(msg, 2.4); else { invSel = i; invMsg = msg.replace('\n', ' · '); }
    return false;
  }
  SAVE.slots[idx] = it.kind === 'pet'
    ? Object.assign(newSlot(it.lv, it.g, animalOf(it.lv, it.g).ht + 1), { born: true })   // 이미 태어난 펫
    : newSlot(it.lv, it.g, it.prog);                       // 자라던 만큼 이어서

  save(); rebuildFarm(); sfx('pick');
  if (state === 'play') toast(`🐣 ${itemName(it)}을(를) 우리에 놓았어요`, 1.6);
}
function placeFromInv(i) {
  if (!SAVE.inv[i]) return;
  const idx = freeSlot();
  if (idx < 0) { invSel = i; invMsg = `우리의 알 놓는 칸이 모두 찼어요 (${SLOTS}칸)`; renderInv(); return; }
  if (placeInvAt(i, idx) !== false) invSel = -1;

// 낮/밤 전환 체크
function updateDayNight() {
  const now = Date.now(), nNow = isNightAt(now), ci = cycleIndex(now);
  if (nNow !== night) {
    night = nNow;
    barrier.visible = night;
    if (night) {
      clearGroundEggs();   // 밤이 되면 내려놓은 달걀도 리셋
      const had = P.held || P.pick;
      loseHeld();
      P.pick = null;
      if (state !== 'title') {
        sfx('night');
        // 오비·둥지 쪽에 있으면 농장으로 순간이동, 들고 있던(들던) 달걀은 사라짐
        if (P.pos.x > barrierC.cx) {
          goFarm();
          toast(had ? '🌙 밤이 되어 농장으로 돌아왔어요\n가지고 있던 달걀이 사라졌어요...' : '🌙 밤이 되어 농장으로 돌아왔어요', 3);
        } else toast(had ? '🌙 밤이 되어 가지고 있던 달걀이 사라졌어요' : '🌙 밤이 되었다!\n방벽이 생겼어요 (달걀이 3배 빨리 자라요)', 2.8);
      }
    }
  }
  if (ci !== lastCycle) {     // 밤이 끝나고 아침 → 달걀 새로 스폰
    lastCycle = ci;
    respawnAllEggs();
    if (state !== 'title') toast('☀️ 아침! 둥지에 새 달걀이 생겼어요', 2.5);
  }
}

const clock = new THREE.Clock();
let hudTick = 0, saveTick = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  T += dt;
  updateDayNight();
  updateMovers(dt, T);
  for (const n of nests) for (const e of n.eggs) {
    if (e.taken) continue;
    e.mesh.rotation.y += dt * 0.8; e.mesh.position.y = e.pos.y + Math.sin(T * 2 + e.ph) * 0.04;
    if (e.aura) { e.aura.position.y = e.mesh.position.y; e.aura.material.opacity = 0.65 + Math.sin(T * 4 + e.ph) * 0.35; e.aura.scale.setScalar(2.2 + Math.sin(T * 3) * 0.3); }
  }
  if (barrier.visible) barrier.material.opacity = 0.45 + Math.sin(T * 6) * 0.15;
  animateSleepers(T);
  if (embers) {
    const a = embers.geometry.attributes.position;
    for (let i = 0; i < a.count; i++) { let y = a.getY(i) + dt * 2; if (y > 30) y = -12; a.setY(i, y); }
    a.needsUpdate = true;
  }
  updateFarm(dt);
  updateOthers(dt);
  NET.tick(dt);
  SAVE.money += totalIncome() * dt;
  if (canWalk()) {
    updatePlayer(dt);
    if (canWalk()) updateBoss(dt);
    hudTick -= dt; if (hudTick <= 0) { hudTick = 0.1; updateHUD(); }
  }
  saveTick -= dt; if (saveTick <= 0) { saveTick = 5; save(); }
  if (playerModel.holder.children[0]) playerModel.holder.children[0].rotation.y += dt * 2;
  updateHotHold();
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $('toast').style.opacity = 0; }
  if (secretTimer > 0) { secretTimer -= dt; if (secretTimer <= 0) $('secretBanner').classList.add('hidden'); }
  updateCamera(dt);
  renderer.render(scene, camera);
}

function netClaimPen() {

function netMsg(m) {

  let o = others.get(m.id);

    if (!o) {
      if (others.size >= PEN_N - 1) return;

    }
    o.seen = Date.now();
    if (o.pen !== m.pen) { const old = o.pen; o.pen = m.pen; o.slots = []; recolor(o.model, PEN_COLORS[o.pen]); setTag(o); rebuildPen(old); rebuildPen(o.pen); drawPenSigns(); }
    const nm = safeName(m.name);
    if (nm && nm !== o.name) { o.name = nm; setTag(o); drawPenSigns(); }
    if (NET.ready && nameKey(o.name) === nameKey(NET.name) && (o.j < NET.j || (o.j === NET.j && o.id < NET.id))) fixDupName();
    applyState(o, m);
    // 같은 우리를 두 사람이 고름 → 늦게 들어온 사람이 다른 빈 우리로 옮김
    if (NET.ready && m.pen === myPen && (m.j < NET.j || (m.j === NET.j && m.id < NET.id))) {
      const free = freePen();
      if (free === undefined) NET.leave('🚫 방이 가득 찼어요 (최대 5명) — 혼자 하기로 해요');

    if (oldest) NET.send({ t: 'world', to: m.id, c: lastCycle,

    (m.grounds || []).forEach(gd => applyGdrop(Object.assign({ c: m.c }, gd)));
  }
  else if (m.t === 'pen' && o) { o.slots = Array.isArray(m.slots) ? m.slots.slice(0, SLOTS) : []; rebuildPen(o.pen); }
  else if (m.t === 'take') applyTake(m);

// 다른 플레이어 움직임 (0.15초마다 오는 위치 사이를 부드럽게 이어 줌)

  '지랄', 'ㅈㄹ', '염병', '옘병', '미친놈', '미친년', '미친새', '미친x', '닥쳐', '꺼져', '엿먹', '니애미', '니미', '느금', '느그엄', '니엄마', '애미', '애비', '엠창', '앰창', 'ㄴㄱㅁ',
  '등신', '또라이', '돌아이', '찐따', '장애인', '애자', '한남', '김치녀', '보슬', '틀딱', '급식충', '맘충', '충새',
  '섹스', '쎅스', '섹시', '야동', '야사', '자위', '딸딸', '보지', '자지', '잠지', '보짓', '젖꼭', '성기', '성교', '정액', '강간', '윤간', '창녀', '창놈', '걸레', '매춘', '원조교', '몸캠', '야한', '음란', '변태', '텐가', '콘돔'];
const BAD_EN = ['fuck', 'fuk', 'fck', 'phuck', 'shit', 'bitch', 'biatch', 'cunt', 'dick', 'cock', 'pussy', 'penis', 'vagina', 'porn', 'sex', 'slut', 'whore', 'rape',
  'nigg', 'nigga', 'fag', 'retard', 'asshole', 'bastard', 'motherf', 'boob', 'tits', 'horny', 'nude', 'naked', 'xxx', 'hentai', 'milf', 'orgasm', 'jizz', 'wank', 'stfu', 'sibal', 'ssibal', 'shibal', 'byungsin'];
function hasBadWord(s) {
  s = String(s || '').toLowerCase();
  const ko = s.replace(/[^가-힣ㄱ-ㅎㅏ-ㅣ]/g, '');                                          // 한글만
  const en = s.replace(/[0@4]/g, c => ({ 0: 'o', '@': 'a', 4: 'a' })[c]).replace(/[1!|]/g, 'i').replace(/3/g, 'e').replace(/[5$]/g, 's').replace(/7/g, 't')
    .replace(/[^a-z]/g, '');                                                                   // 영어만 (숫자 바꿔치기 되돌림)
  return BAD_KO.some(w => ko.includes(w.replace(/[^가-힣ㄱ-ㅎㅏ-ㅣ]/g, '')) && w.replace(/[^가-힣ㄱ-ㅎㅏ-ㅣ]/g, '')) ||
    BAD_EN.some(w => en.includes(w)) || /18(놈|년|새|색|노)|19금|ㅗ/.test(s.replace(/\s/g, ''));
}
const nameKey = s => String(s || '').toLowerCase().replace(/\s/g, '');
const nameTaken = n => [...others.values()].some(o => nameKey(o.name) === nameKey(n));
// 문제가 있으면 이유를, 괜찮으면 '' 를 돌려줌
function checkName(n) {
  n = String(n || '').trim();
  if (n.length < 2) return '이름은 2글자 이상으로 해 주세요';
  if (n.length > 10) return '이름은 10글자까지 쓸 수 있어요';
  if (!/^[가-힣ㄱ-ㅎㅏ-ㅣa-zA-Z0-9 _\-.]+$/.test(n)) return '한글, 영어, 숫자만 쓸 수 있어요';
  if (hasBadWord(n)) return '🚫 욕설·비속어·19금 단어는 이름에 쓸 수 없어요';
  if (nameTaken(n)) return '이미 다른 사람이 쓰고 있는 이름이에요';
  return '';
}
const safeName = n => { n = String(n || '').trim().slice(0, 10); return n && !hasBadWord(n) ? n : '플레이어'; };   // 다른 사람이 보낸 이름
const autoName = () => { let n; do n = '농부 ' + Math.floor(100 + Math.random() * 900); while (nameTaken(n)); return n; };
// 이름 (안 정하면 자동으로 "농부 123")
const NAME_KEY = 'eggthief_name';
function netName() {
  let n = ''; try { n = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}
  if (!n || hasBadWord(n)) { n = autoName(); try { localStorage.setItem(NAME_KEY, n); } catch (e) {} }
  return n;
}
function useName(n) {
  NET.name = n; try { localStorage.setItem(NAME_KEY, n); } catch (e) {}
  setMyTag(); drawPenSigns();
}

// ---------- 닉네임 기록 (한 번 정하면 영원히 내 것) ----------
// 정한 닉네임을 중계 서버에 "보관 메시지"로 남겨 둠 → 나중에 들어온 사람도 같은 이름을 못 씀
// 이 브라우저는 UID로 구분하고, 정한 닉네임은 잠가서(LOCK) 다시 바꿀 수 없음
const NAME_TOPIC = 'eggthief3d/avocado-kr--1/v1/names/';
const LOCK_KEY = 'eggthief_name_locked', UID_KEY = 'eggthief_uid';
const UID = (() => {
  let u = ''; try { u = localStorage.getItem(UID_KEY) || ''; } catch (e) {}
  if (!u) { u = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); try { localStorage.setItem(UID_KEY, u); } catch (e) {} }
  return u;
})();
let nameLocked = false;
try { nameLocked = localStorage.getItem(LOCK_KEY) === '1' && !!localStorage.getItem(NAME_KEY); } catch (e) {}
const nameWait = new Map();   // 기록 확인 중인 토픽 → 결과를 받을 함수
const nameTopic = n => NAME_TOPIC + encodeURIComponent(nameKey(n));
// 이 이름의 주인(UID)을 알아봄 (기록이 없으면 null)
function lookupName(n, cb) {
  const t = nameTopic(n);
  let done = false, owner = null;
  const fin = () => { if (done) return; done = true; nameWait.delete(t); try { NET.client.unsubscribe(t); } catch (e) {} cb(owner); };
  nameWait.set(t, p => { try { owner = JSON.parse(p).uid || null; } catch (e) {} fin(); });
  NET.client.subscribe(t);
  setTimeout(fin, 3000);   // 느린 인터넷에서도 기록을 받을 수 있게 넉넉히 기다림
}
function publishName(n) {
  try { NET.client.publish(nameTopic(n), JSON.stringify({ uid: UID, name: n, t: Date.now() }), { retain: true, qos: 1 }); } catch (e) {}
}
// 이름 차지하기: 주인이 없거나 나면 기록 → 다시 확인해서 동시에 정한 사람이 없는지 봄. cb(문제 이유 | '')
function claimName(n, cb) {
  const TAKEN = '이미 다른 사람이 사용 중인 이름이에요';
  lookupName(n, owner => {
    if (owner && owner !== UID) return cb(TAKEN);
    publishName(n);
    setTimeout(() => lookupName(n, o2 => cb(o2 && o2 !== UID ? TAKEN : '')), 800);
  });
}
function lockName(n) {
  nameLocked = true;
  try { localStorage.setItem(LOCK_KEY, '1'); } catch (e) {}
  useName(n);
}
// 타이틀 화면: 입력하는 동안 바로 검사 (욕설·형식·지금 접속한 사람 이름)
function setNetName(v) {
  v = String(v || '').trim();
  const err = checkName(v);
  const el = $('nameMsg');
  if (el) { el.textContent = err || (v ? `✅ "${v}" — 게임 시작을 누르면 확정돼요 (나중에 바꿀 수 없어요)` : ''); el.style.color = err ? '#ff8080' : '#9dff9d'; }
  const sb = $('startBtn'); if (sb && !nameLocked) sb.disabled = !!err;   // 닉네임을 정해야만 게임 시작 가능
  return !err;
}
// 게임 시작: 닉네임이 잠겨 있으면 바로 시작, 아니면 기록을 확인하고 확정한 뒤 시작
function startWithName() {
  if (nameLocked) { startGame(); return; }
  const v = String($('netName').value || '').trim();
  if (!setNetName(v)) return;
  const el = $('nameMsg'), btn = $('startBtn');
  if (!NET.on || !NET.client) {
    if (!NET.failed) { el.textContent = '🌐 온라인에 연결 중이에요. 잠시 후 다시 눌러 주세요'; el.style.color = '#ffd23f'; return; }
    useName(v); startGame();   // 온라인 연결이 안 되면 혼자 하기 (닉네임은 아직 확정 안 됨)
    toast('🔌 오프라인이라 닉네임은 아직 확정되지 않았어요\n온라인에 연결되면 확정할 수 있어요', 3);
    return;
  }
  el.textContent = '🔎 다른 사람이 쓰는 이름인지 확인하는 중...'; el.style.color = '#ffd23f'; btn.disabled = true;
  claimName(v, err => {
    if (state !== 'title') return;
    btn.disabled = false;
    if (err) { el.textContent = '🚫 ' + err; el.style.color = '#ff8080'; return; }
    lockName(v); startGame();
    toast(`🔒 닉네임 "${v}" 확정! (바꿀 수 없어요)`, 2.5);
  });
}
// 같은 이름이 생기면(확정 전 이름끼리 겹침) 늦게 들어온 내 이름에 숫자를 붙임. 확정한 닉네임은 절대 안 바뀜
function fixDupName() {
  if (nameLocked || !nameTaken(NET.name)) return;
  let n, i = 2;
  const base = NET.name.slice(0, 8);
  do n = base + (i++); while (nameTaken(n));
  useName(n);
  toast(`같은 이름이 있어서 내 이름이 "${n}"(으)로 바뀌었어요`, 3);
}
// 내 캐릭터 머리 위 닉네임
let myTag = null;
function setMyTag() {
  if (myTag) scene.remove(myTag);
  const css = '#' + new THREE.Color(PEN_COLORS[myPen]).offsetHSL(0, 0, 0.15).getHexString();
  myTag = textSprite([{ text: NET.name, font: 'bold 52px Malgun Gothic', color: css, y: 64 }], 512, 128, 2.6, false);
  myTag.position.set(P.pos.x, P.pos.y + 2.4, P.pos.z);
  scene.add(myTag);
}
addEventListener('beforeunload', () => { if (NET.ready) NET.send({ t: 'bye' }); });

addEventListener('beforeunload', save);
loadSave();
buildWorld();
barrier.visible = night;
respawnAllEggs();
rebuildFarm();
placeUpSign();   // 내 우리 앞 업그레이드 표지판
playerModel.g.position.copy(P.pos);
NET.name = netName(); setMyTag();
titleScreen();
NET.start();   // 페이지를 열면 자동으로 온라인 방에 접속
loop();
